<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMIC CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F2A66;--navy-2:#2B3880;--purple:#7F1085;--ink:#1f2328;--muted:#3D4E56;--line:#e3e6ee;--bg:#f5f6fa;--card:#fff;--danger:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
a{color:var(--navy)}
header{background:#fff;border-bottom:3px solid var(--navy);position:sticky;top:0;z-index:10}
.hin{max-width:1880px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 24px;min-height:60px}
.brand{display:flex;align-items:baseline;gap:6px;font-weight:700;color:var(--navy);font-size:24px;letter-spacing:.5px;white-space:nowrap;flex:none}
.brand .dot{color:var(--purple)}
.brand small{font-size:13px;color:var(--purple);font-weight:500;letter-spacing:1px}
nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 14px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;flex:none}
nav a.active{background:var(--navy);color:#fff}
.me{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;flex:none;white-space:nowrap}
#meName{overflow:hidden;text-overflow:ellipsis}
main{max-width:1880px;margin:0 auto;padding:24px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:20px;color:var(--navy);margin:0 0 16px}
h2{font-size:16px;color:var(--navy);margin:0 0 12px;padding-left:10px;border-left:4px solid var(--purple)}
button{font:inherit;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500}
button.ghost{background:#fff;color:var(--navy)}
button.accent{background:var(--purple);border-color:var(--purple)}
button.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-2);outline-offset:-1px}
input:disabled{background:#f3f4f7}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input{max-width:260px}
.toolbar select{width:auto}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#fff;color:var(--muted);padding:7px 14px}
.seg button.on{background:var(--navy);color:#fff}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;background:#fafbfd}
th.sortable{cursor:pointer;user-select:none}
th .arrow{color:var(--purple)}
tbody.click tr{cursor:pointer}
tbody.click tr:hover{background:#f3f4fb}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500}
.tag.potential{background:#f1e6f4;color:var(--purple)}
.tag.formal{background:#e5e8f5;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 20px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field .val{min-height:22px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
textarea{resize:vertical;line-height:1.5}
.tsel{display:flex;align-items:center;gap:6px}
.tsel select{width:auto;min-width:72px}
.checks{display:flex;flex-wrap:wrap;gap:16px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px}
.checks input{width:auto}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
td.row-actions{display:table-cell;white-space:nowrap}
td.row-actions button{margin-right:6px}
td.row-actions button:last-child{margin-right:0}
.muted{color:var(--muted);font-size:13px}
.center{min-height:75vh;display:flex;align-items:center;justify-content:center}
.login{text-align:center;max-width:400px;width:100%}
.login .brand{justify-content:center;font-size:36px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:50;max-width:90vw}
dialog{border:0;border-radius:12px;padding:24px;max-width:760px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,24,50,.45)}
.hidden{display:none!important}
.ver{text-align:center;color:#aab;font-size:11px;padding:8px 0 16px}
.card.warn{background:#FFF6E0;border-color:#F2C46B;color:#5a4300}
tr.left td{color:#9aa}
.bellwrap{position:relative}
.bell{padding:6px 10px;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:var(--purple);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.panel{position:absolute;right:0;top:44px;width:340px;max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(20,24,50,.15);z-index:30;text-align:left;color:var(--ink)}
.panel .ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:500}
.panel .ni{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.panel .ni:hover{background:#f3f4fb}
.panel .ni .t{font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{padding:6px;text-align:center;font-size:13px;color:var(--muted);background:#fafbfd;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dc{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
.cal .dc.out{background:#fafbfd;color:#aab}
.cal .dc.today .dn{background:var(--navy);color:#fff;border-radius:999px;padding:0 6px}
.cal .dn{font-size:12px;display:inline-block;margin-bottom:2px}
.cal.week .dc{min-height:260px}
.ev{display:block;font-size:12px;padding:2px 6px;margin-bottom:2px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff}
.ev.north{background:#3F51B5}
.ev.midsouth{background:#2E7D32}
.ev.leave{background:#D32F2F}
.ev.holiday{background:#F6C026;color:#3a2e00;cursor:default}
.ev.none{background:#78849E}
.wk-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.wk{min-width:640px}
.wk-row{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.wk-lab{font-size:11px;color:var(--muted);text-align:right;padding:6px 6px 0 0}
.wk-head{border-bottom:1px solid var(--line);background:#fafbfd}
.wk-dh{text-align:center;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.wk-dh small{color:var(--muted);font-size:12px}
.wk-dh b{font-size:16px;color:var(--ink);font-weight:500;padding:0 8px;border-radius:999px}
.wk-dh.today b{background:var(--navy);color:#fff}
.wk-all{border-bottom:2px solid var(--line)}
.wk-ad{min-height:30px;padding:3px;border-left:1px solid var(--line);cursor:pointer;min-width:0}
.wk-body{position:relative}
.wk-times{position:relative}
.wk-times span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%);white-space:nowrap}
.wk-times span:first-child{transform:none}
.wk-col{position:relative;border-left:1px solid var(--line);cursor:pointer;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 60px)}
.wk-col.today{background-color:#f7f8fe}
.tev{position:absolute;border-radius:6px;padding:3px 6px;color:#fff;font-size:12px;line-height:1.35;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px #fff;display:flex;flex-direction:column}
.tev b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.tev.short{justify-content:center;padding:1px 6px}
.tev.short b{white-space:nowrap}
.tev .tt{opacity:.85;font-weight:400}
.tev.short:hover{z-index:6;height:auto!important;padding:4px 6px;box-shadow:0 4px 14px rgba(20,24,50,.35)}
.tev.short:hover b{white-space:normal}
.tev:not(.short):hover{z-index:6;box-shadow:0 4px 14px rgba(20,24,50,.35)}
.tev span{opacity:.9;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tev.north{background:#3F51B5}.tev.midsouth{background:#2E7D32}.tev.leave{background:#D32F2F}.tev.none{background:#78849E}
.wk-now{position:absolute;left:-1px;right:0;height:2px;background:#D93025;z-index:2;pointer-events:none}
.wk-now::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#D93025}
.custnav{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.navc{border:1px solid var(--navy);border-radius:8px;padding:5px 12px;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.navc:hover{background:#f3f4fb}
.navc.off{border-color:var(--line);color:#aab}
select.fon{border-color:var(--purple);color:var(--purple);font-weight:500}
.mother{width:auto;flex:1 1 200px}
.ev.priv,.tev.priv{background:#7F1085}
.ev.tent,.tev.tent{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px);outline:1px dashed rgba(255,255,255,.9);outline-offset:-2px}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:500;vertical-align:middle}
.pill.tent{border:1px dashed #b26a00;color:#b26a00}.pill.priv{background:#f1e6f4;color:var(--purple)}
.hello{font-size:26px;font-weight:700;color:var(--navy)}
.hdays{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.hday{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;min-width:0}
.hday.today{border:2px solid var(--navy)}
.hday h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.hitem{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;border-left:4px solid #78849E;background:#f6f7fa;margin-bottom:6px;font-size:14px;cursor:pointer}
.hitem:hover{filter:brightness(.97)}
.hitem.north{border-left-color:#3F51B5;background:#f4f5fd}.hitem.midsouth{border-left-color:#2E7D32;background:#f2f9f2}
.hitem.leave{border-left-color:#D32F2F;background:#fdf3f3}.hitem.priv{border-left-color:#7F1085;background:#fbf3fc}
.hitem.tent{border-left-style:dashed}
.hitem .t{color:var(--muted);min-width:92px;white-space:nowrap}
@media (max-width:900px){.hdays{grid-template-columns:1fr}}
.lday{display:flex;align-items:center;gap:8px;margin:14px 0 6px;padding:6px 10px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.lmsg{padding:8px 10px;border-radius:8px;margin:6px 0;background:#f7f8fc}
.lmsg.off{background:#fafafa;color:#8a94a6}
.lmsg .toolbar{gap:8px}
.marq{background:#FFF6E0;border-bottom:1px solid #F2C46B;color:#5a4300;font-size:14px;overflow:hidden;white-space:nowrap;padding:7px 0}
.marq span#marqText{display:inline-block;padding-left:100%;animation:mq 25s linear infinite}
.marq:hover span#marqText{animation-play-state:paused}
.marq a{color:#5a4300;text-decoration:none;font-weight:500}
@keyframes mq{to{transform:translateX(-100%)}}
.board{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin-bottom:14px}
.post{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.post:last-child{border-bottom:0}
.post:hover b{text-decoration:underline}
.post .pbody{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptag{font-size:12px;border-radius:999px;padding:2px 10px;height:fit-content;white-space:nowrap;font-weight:500}
.ptag.new{background:#e5e8f5;color:var(--navy)}.ptag.imp{background:#fde8e8;color:#c0392b}.ptag.info{background:#eef6ee;color:#2E7D32}
.post .d{color:var(--muted);font-size:12px;white-space:nowrap}
.unread{width:8px;height:8px;border-radius:50%;background:var(--purple);display:inline-block;margin-right:6px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend .north::before{background:#3F51B5}.legend .midsouth::before{background:#2E7D32}.legend .leave::before{background:#D32F2F}.legend .holiday::before{background:#F6C026}.legend .none::before{background:#78849E}.legend .priv::before{background:#7F1085}.legend .plain::before{display:none}
.pick{max-height:320px;overflow:auto;margin-top:8px}
.pick div{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick div:hover{background:#f3f4fb}
@media (max-width:640px){.cal .dc{min-height:64px}.ev{font-size:10px;padding:1px 3px}.panel{position:fixed;left:8px;right:8px;top:96px;width:auto}}
td.wrap{white-space:pre-wrap;min-width:300px}
td.cust{white-space:normal;min-width:160px;max-width:280px}
/* 紀錄頁：欄位跟著螢幕寬度換行，不用一直往右拉 */
table.rfit td{white-space:normal;overflow-wrap:anywhere}
table.rfit td.wrap{white-space:pre-wrap;min-width:180px}
table.rfit td.cust{min-width:120px}
table.rfit td:nth-child(2),table.rfit td.nw{white-space:nowrap}
table.rfit td.row-actions{white-space:nowrap;width:1%}
table.rfit td.row-actions button{margin-right:4px}
table.rfit td.files a{display:block}
th{position:relative}
.colrs{position:absolute;top:0;right:-4px;bottom:0;width:9px;cursor:col-resize;z-index:2}
.colrs:hover,.colrs.on{background:linear-gradient(to right,transparent 3px,var(--purple) 3px,var(--purple) 5px,transparent 5px)}
body.resizing{cursor:col-resize;user-select:none}
.files a{display:block;font-size:13px}
.filelist{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.filelist span{display:flex;gap:8px;align-items:center;font-size:13px}
.x{background:none;border:0;color:var(--danger);padding:0 4px;cursor:pointer}
.small{padding:4px 10px;font-size:13px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec-head h2{margin:0}
.full{grid-column:1/-1}
/* 中等寬度（平板、小筆電）：選單換到第二行 */
@media (max-width:1060px){
  .hin{flex-wrap:wrap;gap:6px 16px;padding:8px 20px 0}
  .me{margin-left:auto}
  nav{order:3;flex-basis:100%;padding-bottom:6px}
}
/* 手機 */
@media (max-width:640px){
  body{font-size:14px}
  .hin{padding:8px 12px 0;gap:4px 10px}
  .brand{font-size:20px}
  .brand small{font-size:11px}
  .me{gap:6px;font-size:12px;min-width:0;flex:1;justify-content:flex-end}
  #meName{max-width:38vw}
  .me button{padding:5px 10px;font-size:13px}
  .bell{padding:4px 8px}
  nav{margin:0 -12px;padding:0 12px 6px}
  nav a{padding:6px 12px;font-size:14px}
  main{padding:12px 10px}
  .card{padding:14px;border-radius:10px;margin-bottom:12px}
  h1{font-size:18px;margin-bottom:12px}
  .toolbar{gap:6px}
  .toolbar input,.toolbar select{flex:1 1 140px;max-width:none!important;min-width:0}
  .seg{max-width:100%;overflow-x:auto}
  .seg button{padding:6px 10px;white-space:nowrap;flex:none}
  .tablewrap{overflow:visible}
  .tablewrap thead{display:none}
  .tablewrap table,.tablewrap tbody,.tablewrap tr{display:block;width:100%}
  .tablewrap tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:#fff}
  .tablewrap td{display:flex;gap:10px;border:0;padding:3px 0;white-space:normal;word-break:break-word;font-size:14px}
  .tablewrap td::before{content:attr(data-label);flex:none;width:64px;color:var(--muted);font-size:12px;padding-top:2px}
  .tablewrap td[data-label=""]::before{display:none}
  .tablewrap td.wrap{min-width:0;max-width:none}
  .tablewrap td.row-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
  .tablewrap td.row-actions button{margin:0}
  .tablewrap .files{flex-direction:column}
  .grid{grid-template-columns:1fr 1fr;gap:10px 12px}
  dialog{padding:16px;width:calc(100% - 16px);max-height:calc(100vh - 32px)}
  dialog .grid{grid-template-columns:1fr}
  button{padding:7px 12px}
}
.tag.mt-late{background:#fbe3e0;color:#a02a1d}.tag.mt-30{background:#fff1d6;color:#7a5200}.tag.mt-90{background:#e5e8f5;color:var(--navy)}
.mt-left{color:#a02a1d;font-size:13px}
select.mst{width:auto;padding:4px 6px;font-size:13px}
#maintBoard{margin-top:12px}
/* 報價單編輯畫面 */
.qwrap{display:grid;grid-template-columns:440px minmax(0,1fr);gap:16px;align-items:start}
.qpanel .card{padding:14px;margin-bottom:12px}
.qpanel h2{font-size:15px}
.q2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.q2 .full{grid-column:1/-1}
.q3{display:grid;grid-template-columns:1fr .6fr 1fr;gap:6px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fbfbfe;display:flex;flex-direction:column;gap:6px}
.qtop{display:flex;gap:6px;align-items:center}
.qtop b{color:var(--navy)}
.qtop input{flex:1}
.qvers{display:flex;flex-direction:column;gap:4px}
.qvers a{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.qvers a.on{background:#e5e8f5}
.qfile{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}
.chk{display:flex;align-items:center;gap:6px;margin:4px 0}
.chk input{width:auto}
.qstage{overflow:auto;min-width:0;position:sticky;top:80px}
dialog.wide{max-width:980px}
@media (max-width:1100px){.qwrap{grid-template-columns:1fr}.qstage{position:static}}
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="hin">
  <div class="brand">tmic<span class="dot">.</span><small>CRM</small></div>
  <nav id="nav"></nav>
  <div class="me"><div class="bellwrap"><button class="ghost bell" id="bell" title="通知">🔔<span class="badge hidden" id="badge"></span></button><div class="panel hidden" id="npanel"></div></div><span id="meName"></span><button class="ghost" id="logout">登出</button></div>
  </div>
</header>
<div id="marq" class="marq hidden"><span id="marqText"></span></div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div class="ver">版本 2026-10-21a</div>

};

// 24 小時制時間選擇（時：分），存成 HH:MM；「時」選空白＝不填
function timeInput(name, val) {
  const [h = '', m = ''] = String(val || '').split(':');
  const mins = []; for (let i = 0; i < 60; i += 5) mins.push(String(i).padStart(2, '0'));
  if (m && !mins.includes(m)) mins.push(m), mins.sort();
  return `<span class="tsel"><input type="hidden" name="${name}" value="${esc(val || '')}"><select class="th"><option value="">--</option>${Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0')).map(x => `<option ${x === h ? 'selected' : ''}>${x}</option>`).join('')}</select><b>:</b><select class="tm">${mins.map(x => `<option ${x === (m || '00') ? 'selected' : ''}>${x}</option>`).join('')}</select></span>`;
}
document.addEventListener('change', e => {
  const box = e.target.closest?.('.tsel'); if (!box) return;
  const h = box.querySelector('.th').value, m = box.querySelector('.tm').value;
  box.querySelector('input').value = h ? `${h}:${m}` : '';
});
// 手機版表格改成卡片：每格加上欄位名稱
function labelTables() {
  document.querySelectorAll('.tablewrap table').forEach(t => {
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.replace(/[▲▼]/g, '').trim());
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', heads[i] || ''); }));
  });
}
// 電腦版：表格欄位可拖拉標題右緣調整寬度（雙擊恢復），寬度記在這台電腦的瀏覽器
const wideScreen = () => window.matchMedia('(min-width:641px)').matches;
const colKey = t => 'colw:' + [...t.querySelectorAll('thead th')].map(th => th.textContent.replace(/[▲▼]/g, '').trim()).join('|');
const loadW = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch (e) { return {}; } };
const saveW = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 無法記住也沒關係 */ } };
function setColW(t, i, w) {
  const ths = t.querySelectorAll('thead th'); if (!ths[i]) return;
  const css = w ? w + 'px' : '';
  ths[i].style.width = ths[i].style.minWidth = ths[i].style.maxWidth = css;
  t.querySelectorAll('tbody tr').forEach(tr => { const td = tr.children[i]; if (td) { td.style.width = td.style.minWidth = td.style.maxWidth = css; td.style.whiteSpace = w ? (td.classList.contains('wrap') ? 'pre-wrap' : 'normal') : ''; } });
}
function enhanceTables() {
  if (!wideScreen()) return;
  document.querySelectorAll('.tablewrap table').forEach(t => {
    const k = colKey(t), saved = loadW(k), ths = [...t.querySelectorAll('thead th')];
    ths.forEach((th, i) => {
      if (saved[i] && th.dataset.w !== String(saved[i])) { th.dataset.w = saved[i]; }
      if (th.querySelector('.colrs') || i === ths.length - 1 || !th.textContent.trim()) return;
      const h = document.createElement('span'); h.className = 'colrs'; h.title = '拖拉調整欄寬，雙擊恢復';
      h.addEventListener('click', e => e.stopPropagation());
      h.addEventListener('dblclick', e => { e.stopPropagation(); const v = loadW(k); delete v[i]; saveW(k, v); delete th.dataset.w; setColW(t, i, 0); });
      h.addEventListener('mousedown', e => {
        e.preventDefault(); e.stopPropagation();
        const x0 = e.clientX, w0 = th.offsetWidth; h.classList.add('on'); document.body.classList.add('resizing');
        const mv = ev => setColW(t, i, Math.max(50, Math.round(w0 + ev.clientX - x0)));
        const up = () => {
          document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
          h.classList.remove('on'); document.body.classList.remove('resizing');
          const v = loadW(k); v[i] = th.offsetWidth; saveW(k, v); th.dataset.w = v[i];
        };
        document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      });
      th.appendChild(h);
    });
    Object.entries(saved).forEach(([i, w]) => setColW(t, Number(i), w));
  });
}
let labelPending = false;
new MutationObserver(() => { if (!labelPending) { labelPending = true; requestAnimationFrame(() => { labelPending = false; labelTables(); enhanceTables(); }); } }).observe(document.body, { childList: true, subtree: true });

const salesLabel = email => { const u = users.get(email); return u ? `${u.nameZh || ''}${u.nameEn ? ' ' + u.nameEn : ''}${u.active === false ? '（離職）' : ''}` : (email || ''); };
const leftCustomers = () => [...customers.values()].filter(c => !c.deleted && c.salesEmail && isLeft(c.salesEmail));

function toast(msg, ms = 3000) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), ms);
}
function errMsg(e) {
  if (e?.code === 'permission-denied') return '權限不足，無法執行';
  return e?.message || String(e);
}

    <div class="brand">tmic<span class="dot">.</span><small>CRM</small></div>

  $('#gl')?.addEventListener('click', () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast(errMsg(e))));

$('#logout').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async u => {
  me = null; customers.clear(); users.clear();
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  if (unsubNotes) { unsubNotes(); unsubNotes = null; }
  notes = []; renderBell();
  if (timer) { clearInterval(timer); timer = null; }
  stopSchedLive();
  if (!u) { viewLogin(); return; }
  const email = (u.email || '').toLowerCase();
  let snap = null;
  try { snap = await getDoc(doc(db, 'users', email)); } catch (e) { snap = null; }
  if (!snap || !snap.exists() || snap.data().active === false) {
    viewLogin(`${email} 尚未開通，請聯絡管理者加入人員名單。`);
    return;
  }
  me = { ...snap.data(), email };
  $('#hdr').classList.remove('hidden');
  $('#meName').textContent = `${me.nameZh || email}（${ROLE[me.role] || me.role}）`;
  app.innerHTML = '<div class="card"><p class="muted">載入資料中…</p></div>';

  unsubUsers = onSnapshot(collection(db, 'users'), s => {
    users.clear();
    s.forEach(d => users.set(d.id, { ...d.data(), email: d.id }));
    if (me && (!users.has(me.email) || users.get(me.email).active === false)) { signOut(auth); return; }
    if (!document.querySelector('dialog[open]')) route();
  });

  unsubNotes = onSnapshot(query(collection(db, 'notifications'), where('to', '==', me.email), where('read', '==', false)), s => {
    notes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    renderBell();
  }, () => {});

  // 同一台電腦換帳號登入時，不沿用上一位的本機暫存，改向伺服器重抓
  let switched = false;
  try { switched = localStorage.getItem('crm_last_user') !== email; localStorage.setItem('crm_last_user', email); } catch (e) { switched = true; }
  try { await syncCustomers(switched); } catch (e) { toast('客戶資料載入不完整：' + errMsg(e), 10000); }
  privCache = null;
  try { const pf = await getDoc(doc(db, 'prefs', email)); cal.weekStart = pf.exists() && pf.data().weekStart === 1 ? 1 : 0; if (pf.exists() && ['month', 'week', 'list'].includes(pf.data().calView)) cal.view = pf.data().calView; annRead = (pf.exists() && pf.data().annRead) || {}; } catch (e) { cal.weekStart = 0; }
  annCache = null; await loadAnn();
  route();
  timer = setInterval(() => { if (document.visibilityState === "visible") softRefresh(); }, 5 * 60 * 1000); // 視窗沒在看時不更新，省讀取次數
});

});

// ---------------- 客戶資料同步（只抓有變動的資料，節省讀取額度）----------------
function customersBaseQueries() {
  const col = collection(db, 'customers');
  if (me.role === 'sales') return [query(col, where('salesEmail', '==', me.email))];
  if (me.role === 'manager') {
    const qs = [query(col, where('salesEmail', '==', me.email))];
    const regs = userRegions(me);
    if (regs.length) qs.push(query(col, where('region', 'in', regs)));
    return qs;
  }
  return [col];
}
async function syncOne(base, full) {
  let max = null;
  if (!full) {
    try {
      const cached = await getDocsFromCache(base);
      cached.docs.forEach(d => {
        const data = d.data();
        customers.set(d.id, { id: d.id, ...data });
        if (!d.metadata.hasPendingWrites && data.updatedAt && (!max || data.updatedAt.toMillis() > max.toMillis())) max = data.updatedAt;
      });
    } catch (e) { /* 沒有快取時改抓全部 */ }
  }
  const snap = await getDocs(max ? query(base, where('updatedAt', '>', max)) : base);
  snap.docs.forEach(d => customers.set(d.id, { id: d.id, ...d.data() }));
}
async function syncCustomers(full = false) {
  if (full) customers.clear();
  for (const base of customersBaseQueries()) await syncOne(base, full);
  lastSync = Date.now();
}
async function softRefresh() {
  try { await syncCustomers(); if (!document.querySelector('dialog[open]')) route(); } catch (e) { /* 背景更新失敗時不打擾使用者 */ }
}

// ---------------- 路由 ----------------
function renderNav() {
  const h = location.hash || '#/home';
  const items = [['#/home', '首頁'], ['#/customers', '客戶'], ['#/records', '紀錄'], ['#/calendar', '行事曆']];
  if (isAdmin() || isEngineer()) items.push(['#/line', 'LINE']);
  if (isAdmin()) items.push(['#/quotes', '報價單'], ['#/users', '人員管理'], ['#/settings', '編號設定'], ['#/import', '資料匯入']);
  $('#nav').innerHTML = items.map(([href, t]) => {
    const on = h.startsWith(href) || (href === '#/customers' && h.startsWith('#/customer/')) || (href === '#/quotes' && h.startsWith('#/quote/'));
    return `<a href="${href}" class="${on ? 'active' : ''}">${t}</a>`;
  }).join('');
}
function route() {
  if (!me) return;
  renderNav();
  const [, page, id] = (location.hash || '#/home').split('/');
  if (page === 'customer' && id) viewCustomer(decodeURIComponent(id));
  else if (page === 'home' || !page) viewHome();
  else if (page === 'calendar') viewCalendar();
  else if (page === 'records') viewRecords();
  else if (page === 'line' && (isAdmin() || isEngineer())) viewLine();
  else if (page === 'quotes' && isAdmin()) (id === 'tpl' ? viewQuoteTpls() : viewQuotes());
  else if (page === 'quote' && id && isAdmin()) viewQuote(decodeURIComponent(id));
  else if (page === 'users' && isAdmin()) viewUsers();
  else if (page === 'settings' && isAdmin()) viewSettings();
  else if (page === 'import' && isAdmin()) viewImport();
  else if (page === 'customers') viewCustomers();
  else viewHome();
}
window.addEventListener('hashchange', route);

      <input id="fQ" placeholder="搜尋名稱、編號、聯絡人、電話" value="${esc(ui.q)}">

  </div>`;
  $('#showLeft')?.addEventListener('click', () => { ui.sales = '__left'; ui.status = 'all'; viewCustomers(); });
  $('#showCheck')?.addEventListener('click', () => { ui.sales = '__check'; ui.status = 'all'; viewCustomers(); });
  $('#seg').addEventListener('click', e => { const k = e.target.dataset.k; if (!k) return; ui.status = k; viewCustomers(); });
  $('#fRegion').addEventListener('change', e => { ui.region = e.target.value; renderTable(); });
  $('#fSales')?.addEventListener('change', e => { ui.sales = e.target.value; renderTable(); });
  $('#fQ').addEventListener('input', e => { ui.q = e.target.value; renderTable(); });
  $('#refresh').addEventListener('click', async () => {

    renderTable();
  });

function renderTable() {
  const q = ui.q.trim().toLowerCase();
  const list = [...customers.values()].filter(c => !c.deleted)
    .filter(c => ui.status === 'all' || c.status === ui.status)
    .filter(c => !ui.region || (ui.region === '__none' ? !c.region : c.region === ui.region))
    .filter(c => !ui.sales || (ui.sales === '__left' ? (c.salesEmail && isLeft(c.salesEmail)) : ui.sales === '__check' ? c.needsCheck : c.salesEmail === ui.sales))
    .filter(c => !q || [custNo(c), c.leadNo, c.name, c.contact, c.phone, c.mobile].some(v => String(v || '').toLowerCase().includes(q)));
  const col = COLS.find(c => c[0] === ui.sort) || COLS[0];
  list.sort((a, b) => String(col[2](a) || '').localeCompare(String(col[2](b) || ''), 'zh-Hant', { numeric: true }) * ui.dir);
  $('#thead').innerHTML = COLS.map(([k, t]) => `<th class="sortable" data-k="${k}">${t}${ui.sort === k ? `<span class="arrow">${ui.dir > 0 ? ' ▲' : ' ▼'}</span>` : ''}</th>`).join('');
  $('#tbody').innerHTML = list.map(c => `<tr data-id="${esc(c.id)}">
    <td>${esc(custNo(c))}</td><td>${esc(c.name)}</td>
    <td><span class="tag ${c.status === 'formal' ? 'formal' : 'potential'}">${c.status === 'formal' ? '正式' : '潛在'}</span></td>
    <td>${esc(c.region)}</td><td>${esc(salesLabel(c.salesEmail))}</td><td>${esc(c.contact)}</td><td>${esc(c.phone)}</td><td>${esc(c.maintenanceDate)}</td>
  </tr>`).join('') || '<tr><td colspan="8" class="muted">沒有資料</td></tr>';
  $('#count').textContent = `共 ${list.length} 筆`;
}

// ---------------- 客戶詳細頁 ----------------
function viewCustomer(id) {
  const c = customers.get(id);
  if (!c || c.deleted) {
    app.innerHTML = '<div class="card"><p>找不到這位客戶，或你沒有檢視權限。</p><a href="#/customers">← 回客戶列表</a></div>';
    return;
  }
  const f = (label, val) => `<div class="field"><label>${label}</label><div class="val">${esc(val) || '<span class="muted">—</span>'}</div></div>`;
  const lic = LICENSES.filter(([k]) => c.license?.[k]).map(([, t]) => t).join('、');
  // 依編號（流水號）找同類客戶的上一位、下一位
  const seq = [...customers.values()].filter(x => !x.deleted && x.id !== UNLINKED_ID && x.status === c.status && custNo(x))
    .sort((a, b) => custNo(a).localeCompare(custNo(b), 'en', { numeric: true }));
  const pos = seq.findIndex(x => x.id === c.id);
  const prevC = pos > 0 ? seq[pos - 1] : null, nextC = pos >= 0 && pos < seq.length - 1 ? seq[pos + 1] : null;
  const navBtn = (x, t) => x ? `<a class="navc" href="#/customer/${encodeURIComponent(x.id)}" title="${esc(custNo(x))} ${esc(x.name)}">${t}</a>` : `<span class="navc off">${t}</span>`;

      ${COMMON.slice(1).map(([k, t]) => k === 'address' && c.address ? `<div class="field"><label>${t}</label><div class="val">${mapLink(c.address)}</div></div>` : k === 'website' && c.website ? `<div class="field"><label>${t}</label><div class="val"><a href="${esc(/^https?:\/\//i.test(c.website) ? c.website : 'https://' + c.website)}" target="_blank" rel="noopener">${esc(c.website)}</a></div></div>` : f(t, c[k])).join('')}

// ---------------- 新增／編輯客戶 ----------------
function customerForm(c, preset = {}, onCreated = null) {
  const isNew = !c;
  const cur = c || { status: 'potential', license: {}, ...preset };
  const MULTI = ['companyProduct', 'address', 'currentSoftware', 'contact', 'phone', 'mobile', 'email', 'purchasedProduct'];
  const rowsOf = v => Math.min(10, Math.max(2, String(v || '').split('\n').length + Math.floor(String(v || '').length / 40)));
  const inp = (k, t, req) => MULTI.includes(k)
    ? `<div class="field ${k === 'purchasedProduct' ? 'full' : ''}"><label>${t}${req ? ' *' : ''}${k === 'purchasedProduct' ? '　<button type="button" class="ghost small" id="autoBreak">依日期自動分行</button>' : ''}</label><textarea name="${k}" rows="${rowsOf(cur[k])}">${esc(cur[k])}</textarea></div>`
    : `<div class="field"><label>${t}${req ? ' *' : ''}</label><input name="${k}" value="${esc(cur[k])}"></div>`;
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form id="cf">
    <h1>${isNew ? '新增客戶' : `編輯客戶　${esc(custNo(cur))}`}</h1>
    <div class="grid">
      ${isNew ? '<div class="field"><label>類型 *</label><select name="status"><option value="potential">潛在客戶</option><option value="formal">正式客戶</option></select></div>' : ''}
      ${!isNew ? `<div class="field"><label>潛在編號</label><input name="leadNo" value="${esc(cur.leadNo)}" placeholder="L-A00001"><button type="button" class="ghost small" data-newno="lead" style="margin-top:6px">取用新的 L 編號</button></div>
      ${cur.status === 'formal' ? `<div class="field"><label>正式編號 *</label><input name="formalNo" value="${esc(cur.formalNo)}" placeholder="C00001"><button type="button" class="ghost small" data-newno="formal" style="margin-top:6px">取用新的 C 編號</button></div>` : ''}` : ''}
      <div class="field"><label>區域</label><select name="region"><option value="">（未分區）</option>${REGIONS.map(r => `<option ${cur.region === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="field"><label>負責業務</label><select name="salesEmail"><option value="">（未指定）</option>${salesOptions(cur.salesEmail)}</select></div>
      ${COMMON.map(([k, t, r]) => inp(k, t, r)).join('')}
    </div>
    <div id="formalPart">
      <h2 style="margin-top:20px">產品與授權</h2>
      <div class="grid">${inp('purchasedProduct', '購買產品')}<div class="field"><label>維護日期</label><input type="date" name="maintenanceDate" value="${esc(cur.maintenanceDate)}"></div></div>
      <div class="checks" style="margin-top:12px">${LICENSES.map(([k, t]) => `<label><input type="checkbox" name="lic_${k}" ${cur.license?.[k] ? 'checked' : ''}>${t}</label>`).join('')}</div>
    </div>
    <div class="row-actions" style="margin-top:24px;justify-content:flex-end">
      <button type="button" class="ghost" id="cancel">取消</button><button type="submit" id="save">儲存</button>
    </div>
  </form>`;
  document.body.appendChild(dlg);
  const form = dlg.querySelector('#cf');
  const statusNow = () => isNew ? form.status.value : cur.status;
  const togglePart = () => dlg.querySelector('#formalPart').classList.toggle('hidden', statusNow() !== 'formal');
  togglePart();
  if (isNew) form.status.addEventListener('change', togglePart);
  // 購買產品：在每個日期（如 2021/11/18、2022-08-10）前與「；」後換行
  dlg.querySelector('#autoBreak')?.addEventListener('click', () => {
    const ta = form.purchasedProduct;
    ta.value = ta.value.replace(/\s*[；;]\s*/g, '\n').replace(/(?<![至到～~(（])\s*((?:19|20)\d{2}[\/.-]\d{1,2}[\/.-]\d{1,2})(?![\d)～~-])/g, '\n$1')
      .split('\n').map(x => x.trim()).filter(Boolean).join('\n');
    ta.rows = Math.min(12, ta.value.split('\n').length + 1);
  });
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#cancel').addEventListener('click', close);
  dlg.addEventListener('cancel', () => dlg.remove());
  dlg.querySelectorAll('[data-newno]').forEach(btn => btn.addEventListener('click', async () => {
    const kind = btn.dataset.newno;
    const region = form.region.value;
    if (kind === 'lead' && !REGION_CODE[region]) return toast('請先選區域，才能產生 L 編號');
    if (!confirm('會用掉一個新號碼，確定取用？')) return;
    try {
      const key = kind === 'formal' ? 'formal' : 'lead_' + REGION_CODE[region];
      const no = await runTransaction(db, async tx => {
        const ref = doc(db, 'counters', key); const s0 = await tx.get(ref);
        const n = s0.exists() ? s0.data().next : 1; tx.set(ref, { next: n + 1 });
        return kind === 'formal' ? fmt('C', n) : fmt('L-' + REGION_CODE[region], n);
      });
      form[kind === 'formal' ? 'formalNo' : 'leadNo'].value = no;
      toast('已填入 ' + no + '，按儲存後生效');
    } catch (err) { toast(errMsg(err)); }
  }));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(form);
    const status = statusNow();
    const data = {};
    COMMON.forEach(([k]) => (data[k] = String(fd.get(k) || '').trim()));
    data.region = fd.get('region') || '';
    data.salesEmail = fd.get('salesEmail') || '';
    if (status === 'formal') {
      data.purchasedProduct = String(fd.get('purchasedProduct') || '').trim();
      data.maintenanceDate = fd.get('maintenanceDate') || '';
      data.license = Object.fromEntries(LICENSES.map(([k]) => [k, fd.get('lic_' + k) === 'on']));
    }
    if (!data.name) return toast('請填寫客戶名稱');
    if (isNew && status === 'potential' && !data.region) return toast('潛在客戶必須選擇區域（用來產生 L 編號）');
    if (!isNew) {
      const lead = String(fd.get('leadNo') || '').trim().toUpperCase();
      const formal = String(fd.get('formalNo') ?? cur.formalNo ?? '').trim().toUpperCase();
      if (lead && !/^L-[ABC]\d{5}$/.test(lead)) return toast('潛在編號格式應為 L-A00001（A 台北、B 台中、C 台南）');
      if (status === 'potential' && !lead) return toast('潛在客戶必須有潛在編號');
      if (status === 'formal' && !/^C\d{5}$/.test(formal)) return toast('正式編號格式應為 C00001');
      const clash = [...customers.values()].find(x => x.id !== cur.id && !x.deleted && ((lead && x.leadNo === lead) || (status === 'formal' && x.formalNo === formal)));
      if (clash) return toast(`編號已被使用：${custNo(clash)} ${clash.name}`, 6000);
      data.leadNo = lead;
      if (status === 'formal') data.formalNo = formal;
    }
    dlg.querySelector('#save').disabled = true;
    try {
      let id = cur.id;
      if (isNew) {
        await runTransaction(db, async tx => {
          const key = status === 'formal' ? 'formal' : 'lead_' + REGION_CODE[data.region];
          const cref = doc(db, 'counters', key);
          const s = await tx.get(cref);
          const n = s.exists() ? s.data().next : 1;
          const ref = doc(collection(db, 'customers'));
          tx.set(cref, { next: n + 1 });
          tx.set(ref, {
            ...data, status,
            leadNo: status === 'potential' ? fmt('L-' + REGION_CODE[data.region], n) : '',
            formalNo: status === 'formal' ? fmt('C', n) : '',
            deleted: false, createdBy: me.email, createdAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp()
          });
          id = ref.id;
        });
      } else {
        await updateDoc(doc(db, 'customers', cur.id), { ...data, needsCheck: false, updatedBy: me.email, updatedAt: serverTimestamp() });
        // 區域改了：這位客戶的 Demo 紀錄也一起改區域（業務主管依區域看 Demo）
        if ((data.region || '') !== (cur.region || '')) {
          try {
            const ds = (await getDocs(query(collection(db, 'demos'), where('customerId', '==', cur.id)))).docs;
            for (let i = 0; i < ds.length; i += 200) { const b = writeBatch(db); ds.slice(i, i + 200).forEach(d => b.update(d.ref, { region: data.region || '', updatedBy: me.email, updatedAt: serverTimestamp() })); await b.commit(); }
            recsCache.clear(); recCache.delete(cur.id);
          } catch (e2) { toast('Demo 紀錄區域更新失敗：' + errMsg(e2), 8000); }
        }
      }
      close();
      await syncCustomers();
      toast('已儲存');
      if (isNew && onCreated) { try { await onCreated(id); } catch (e2) { /* 連結行程失敗不影響客戶建立 */ } }
      if (isNew) location.hash = '#/customer/' + encodeURIComponent(id); else route();
    } catch (err) {
      toast(errMsg(err));
      dlg.querySelector('#save').disabled = false;
    }
  });
  dlg.showModal();
}

async function convertToFormal(c) {
  if (!confirm(`確定將 ${c.leadNo} ${c.name} 轉為正式客戶？\n系統會產生新的 C 編號，原 L 編號保留。`)) return;
  try {
    await runTransaction(db, async tx => {
      const cref = doc(db, 'counters', 'formal');
      const ref = doc(db, 'customers', c.id);
      const s = await tx.get(cref);
      const cs = await tx.get(ref);
      if (!cs.exists() || cs.data().status !== 'potential') throw new Error('此客戶已不是潛在客戶');
      const n = s.exists() ? s.data().next : 1;
      tx.set(cref, { next: n + 1 });
      tx.update(ref, { status: 'formal', formalNo: fmt('C', n), convertedAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp() });
    });
    await syncCustomers();
    route();
    toast('已轉為正式客戶，請補填產品與授權資料');
    customerForm(customers.get(c.id));
  } catch (e) { toast(errMsg(e)); }
}

async function deleteCustomer(c) {
  if (!confirm(`確定刪除 ${custNo(c)} ${c.name}？`)) return;
  try {
    await updateDoc(doc(db, 'customers', c.id), { deleted: true, updatedBy: me.email, updatedAt: serverTimestamp() });
    await syncCustomers();
    toast('已刪除');
    location.hash = '#/customers';
  } catch (e) { toast(errMsg(e)); }
}

const REC_ORDER = ['demos', 'purchases', 'issues', 'installs'];
// 子紀錄（採購／問題追蹤／安裝）改連結客戶：先標記要搬去哪 → 在新客戶建立 → 刪除舊的（權限規則會確認新位置已存在）
async function moveSubRec(col, fromCid, toCid, id, data) {
  await updateDoc(doc(db, 'customers', fromCid, col, id), { movingTo: toCid });
  const { movingTo, ...clean } = data;
  await setDoc(doc(db, 'customers', toCid, col, id), { ...clean, updatedBy: me.email, updatedAt: serverTimestamp() });
  await deleteDoc(doc(db, 'customers', fromCid, col, id));
}
const canMoveRec = k => isAdmin() || (isEngineer() && ['issues', 'installs'].includes(k)); // 工程師可替問題追蹤、安裝紀錄改連結客戶
const recCache = new Map(); // customerId -> {demos:[], purchases:[], ...}

function recCol(key, c) { return REC[key].top ? collection(db, key) : collection(db, 'customers', c.id, key); }
// Demo 紀錄可看範圍：管理者全部；業務只看自己的業務 Demo；業務主管看自己＋負責區域的業務 Demo；工程師看全部工程師 Demo
const seesSalesDemos = () => isAdmin() || ['sales', 'manager'].includes(me?.role);
const seesEngDemos = () => isAdmin() || isEngineer() || !!me?.alsoEngineer;
function demoSets() {
  if (isAdmin()) return null;
  const sets = [];
  if (seesEngDemos()) sets.push([where('type', '==', 'engineer')]);
  if (['sales', 'manager'].includes(me.role)) sets.push([where('type', '==', 'sales'), where('salesEmail', '==', me.email)]);
  if (me.role === 'manager') userRegions(me).forEach(r => sets.push([where('type', '==', 'sales'), where('region', '==', r)]));
  return sets;
}
async function queryDemos(extra = []) {
  const sets = demoSets();
  if (!sets) return (await getDocs(query(collection(db, 'demos'), ...extra))).docs;
  const m = new Map();
  for (const st of sets) (await getDocs(query(collection(db, 'demos'), ...st, ...extra))).docs.forEach(d => m.set(d.id, d));
  return [...m.values()];
}
async function loadRecords(c) {
  const out = {};
  for (const k of REC_ORDER) {
    if (k === 'demos') { out[k] = (await queryDemos([where('customerId', '==', c.id)])).map(d => ({ id: d.id, ...d.data() })); continue; }
    const q = REC[k].top ? query(collection(db, k), where('customerId', '==', c.id)) : recCol(k, c);
    out[k] = (await getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() }));
  }
  recCache.set(c.id, out);
  return out;
}
async function showRecords(c, reload = false) {
  let data = recCache.get(c.id);
  if (!data || reload) {
    try { data = await loadRecords(c); } catch (e) { const box = $('#records'); if (box) box.innerHTML = `<div class="card"><p class="muted">紀錄載入失敗：${esc(errMsg(e))}</p></div>`; return; }
  }
  const box = $('#records');
  if (!box || !location.hash.includes(encodeURIComponent(c.id))) return;
  const keys = REC_ORDER.filter(k => k !== 'purchases' || c.status === 'formal' || (data.purchases || []).length);
  box.innerHTML = keys.map(k => {
    const R = REC[k];
    const rows = [...(data[k] || [])].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    const cell = (r, [f, , fn, wrap]) => {
      if (f === 'files') return `<td class="files">${(r.files || []).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join('') || '—'}</td>`;
      if (f === 'link' && r.link) return `<td><a href="${esc(r.link)}" target="_blank" rel="noopener">開啟</a></td>`;
      const v = fn ? fn(r) : r[f];
      return `<td class="${wrap ? 'wrap' : ''}">${esc(v) || '—'}</td>`;
    };
    return `<div class="card" data-k="${k}">
      <div class="sec-head"><h2>${R.title}</h2><span class="muted">${rows.length} 筆</span><span class="spacer"></span>${R.canAdd() ? `<button class="small" data-act="add">＋ 新增</button>` : ''}</div>
      ${rows.length ? `<div class="tablewrap"><table><thead><tr>${R.cols.map(([, t]) => `<th>${t}</th>`).join('')}<th>建立者</th><th></th></tr></thead><tbody>
        ${rows.map(r => `<tr data-id="${esc(r.id)}">${R.cols.map(col => cell(r, col)).join('')}<td>${esc(salesLabel(r.createdBy))}</td>
          <td class="row-actions">${R.canEdit(r) ? '<button class="ghost small" data-act="edit">編輯</button>' : ''}${R.canDel(r) ? '<button class="danger small" data-act="del">刪除</button>' : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">尚無紀錄</p>'}
    </div>`;
  }).join('');
  box.querySelectorAll('.card[data-k]').forEach(card => card.addEventListener('click', async e => {
    const act = e.target.dataset.act; if (!act) return;
    const k = card.dataset.k; const id = e.target.closest('tr')?.dataset.id;
    const r = id ? (recCache.get(c.id)[k] || []).find(x => x.id === id) : null;
    if (act === 'add') recordForm(k, c, null);
    if (act === 'edit' && r) recordForm(k, c, r);
    if (act === 'del' && r) {
      if (!confirm(`確定刪除這筆${REC[k].title}？`)) return;
      try { await deleteDoc(doc(recCol(k, c), r.id)); toast('已刪除'); if (k === 'schedules') schedCache.clear(); allSchedCache = null; afterRecordChange(c); } catch (err) { toast(errMsg(err)); }
    }
  }));
}

async function uploadFile(file, kind, customerNo) {
  if (!UPLOAD_URL) throw new Error('尚未設定檔案上傳網址（UPLOAD_URL）');
  if (file.size > 10 * 1024 * 1024) throw new Error(`${file.name} 超過 10MB`);
  const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); });
  const j = await callScript('upload', { kind, customerNo, name: file.name, mimeType: file.type, data });
  return { name: j.name, url: j.url };
}
async function callScript(action, payload) {
  if (!UPLOAD_URL) throw new Error('尚未設定 Apps Script 網址');
  const idToken = await auth.currentUser.getIdToken();
  const resp = await fetch(UPLOAD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, idToken, ...payload }) });
  const j = await resp.json();
  if (!j.ok) throw new Error(j.error || '執行失敗');
  return j;
}
// 同步行程到 Google 日曆（CRM → Google 單向）；回傳成功筆數
async function gcalSync(ids, quiet = false) {
  let ok = 0;
  try {
    const r = await callScript('gcalUpsert', { scheduleIds: ids });
    for (const [id, ev] of Object.entries(r.events || {})) {
      if (!ev) continue;
      if (ev.error) { if (!quiet) toast('Google 日曆同步失敗：' + ev.error, 8000); continue; }
      ok++;
      if (ev.created) await updateDoc(doc(db, 'schedules', id), { gcalId: ev.eventId });
    }
  } catch (err) { if (!quiet) toast('Google 日曆同步失敗：' + errMsg(err), 8000); else throw err; }
  return ok;
}
// 行程建立後：系統內通知＋Email
async function notifySchedule(id, data) {
  const to = [...new Set([data.salesEmail, data.engineerEmail].filter(Boolean))];
  if (!to.length) return;
  const title = `新行程：${data.title}`;
  const body = `${dateRangeText(data)} ${timeText(data)}｜${SCHED_TYPE[data.type] || ''}`;
  for (const email of to) {
    try { await addDoc(collection(db, 'notifications'), { to: email, from: me.email, title, body, scheduleId: id, date: data.date, read: false, createdAt: serverTimestamp() }); } catch (e) { /* 單筆失敗不影響其他 */ }
  }
  try {
    const j = await callScript('notify', { scheduleId: id });
    toast(j.sent ? `已寄出 Email 給 ${j.sent} 人` : 'Email 未寄出：Apps Script 回傳 0 位收件人（可能尚未更新為新版程式）', 10000);
  } catch (e) { toast('行程已儲存，但 Email 通知失敗：' + errMsg(e), 10000); }
}

function recordForm(k, c, r, preset = {}) {
  const R = REC[k];
  const isNew = !r;
  const cur = r || Object.assign(['demos', 'schedules'].includes(k) ? { type: me.role === 'engineer' ? 'engineer' : 'sales', date: new Date().toLocaleDateString('sv-SE'), salesEmail: ['sales', 'manager'].includes(me.role) ? me.email : (c.salesEmail || ''), engineerEmail: me.role === 'engineer' ? me.email : '' } : { date: new Date().toLocaleDateString('sv-SE') }, preset);
  let files = [...(cur.files || [])];
  const lock = k === 'demos' && !isAdmin() && demoTypes().length === 1 ? demoTypes()[0] : null;
  if (lock) { cur.type = lock; if (lock === 'sales') cur.salesEmail = me.email; else cur.engineerEmail = me.email; }
  const field = ([f, t, type, req, opt, full]) => {
    const lab = `<label>${t}${req ? ' *' : ''}</label>`;
    const cls = `field${full ? ' full' : ''}`;
    if (lock && f === 'type') return `<div class="${cls}">${lab}<input type="hidden" name="type" value="${lock}"><div class="val">${DEMO_TYPE[lock]}</div></div>`;
    if (lock && ((lock === 'sales' && f === 'salesEmail') || (lock === 'engineer' && f === 'engineerEmail'))) return `<div class="${cls}">${lab}<input type="hidden" name="${f}" value="${esc(me.email)}"><div class="val">${esc(salesLabel(me.email))}</div></div>`;
    if (type === 'textarea') return `<div class="${cls}">${lab}<textarea name="${f}" rows="4">${esc(cur[f])}</textarea></div>`;
    if (type === 'date') return `<div class="${cls}">${lab}<input type="date" name="${f}" value="${esc(cur[f])}"></div>`;
    if (type === 'time') return `<div class="${cls}">${lab}${timeInput(f, cur[f])}</div>`;
    if (type === 'sched') {
      const list = [...((recCache.get(c.id) || {}).schedules || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      return `<div class="${cls}">${lab}<select name="${f}"><option value="">（不指定）</option>${list.map(x => `<option value="${esc(x.id)}" ${cur[f] === x.id ? 'selected' : ''}>${esc(x.date)} ${esc(x.startTime)} ${esc(DEMO_TYPE[x.type] || '')}</option>`).join('')}</select></div>`;
    }
    if (type === 'select') return `<div class="${cls}">${lab}<select name="${f}">${opt().map(([v, tt]) => `<option value="${v}" ${cur[f] === v ? 'selected' : ''}>${tt}</option>`).join('')}</select></div>`;
    if (type === 'user') return `<div class="${cls}">${lab}<select name="${f}"><option value="">（未指定）</option>${userOptions(opt, cur[f])}</select></div>`;
    if (type === 'list') return `<div class="${cls}">${lab}<input name="${f}" list="dl_${f}" value="${esc(cur[f])}"><datalist id="dl_${f}">${opt.map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>`;
    if (type === 'multi') {
      const have = prodTokens(cur[f]);
      const all = [...opt, ...have.filter(x => !opt.includes(x))];
      return `<div class="${cls} full">${lab}<input type="hidden" name="${f}" value="${esc(have.join(', '))}"><div class="checks mchk" data-for="${f}">${all.map(o => `<label><input type="checkbox" value="${esc(o)}" ${have.includes(o) ? 'checked' : ''}>${esc(o)}</label>`).join('')}<input class="mother" placeholder="其他（自行輸入，多個用逗號隔開）" style="max-width:280px"></div></div>`;
    }
    if (type === 'files') return `<div class="${cls}">${lab}<div class="filelist" id="flist"></div><input type="file" name="__files" multiple accept=".pdf,image/*,.lic,.dat,.txt,.zip"><div class="muted">每個檔案 10MB 以內，存放於 Google Drive</div></div>`;
    return `<div class="${cls}">${lab}<input name="${f}" value="${esc(cur[f])}"${f === 'participants' ? ' placeholder="多位用頓號隔開，例：林工程師、王經理"' : ''}></div>`;
  };
  const dlg = document.createElement('dialog');
  let target = c; // 管理者可在編輯時更換連結客戶
  const custLine = () => `<span id="custName">${esc(custNo(target))}　${esc(target.name)}</span>${target.id !== c.id ? ' <span class="tag potential">將更換</span>' : ''}`;
  const editCreator = !isNew && k === 'issues' && (r.source === 'ironcad' || r.createdBy === 'system') && (isAdmin() || isEngineer());
  dlg.innerHTML = `<form id="rf"><h1>${isNew ? '新增' : '編輯'}${R.title}</h1><p class="muted" id="custLine">${custLine()}</p>${!isNew && canMoveRec(k) ? '<p><button type="button" class="ghost small" id="chgCust">更換連結客戶</button></p>' : ''}
    <div class="grid">${R.fields.map(field).join('')}${editCreator ? `<div class="field"><label>建立者</label><select name="__creator"><option value="system" ${r.createdBy === 'system' ? 'selected' : ''}>system（原廠自動匯入）</option>${userOptions(['engineer'], r.createdBy)}</select></div>` : ''}</div>
    <div class="row-actions" style="margin-top:24px;justify-content:flex-end"><button type="button" class="ghost" id="cancel">取消</button><button type="submit" id="save">儲存</button></div></form>`;
  document.body.appendChild(dlg);
  const form = dlg.querySelector('#rf');
  dlg.querySelector('#chgCust')?.addEventListener('click', () => {
    dlg.close();
    pickCustomer(c2 => { if (c2) { target = c2; dlg.querySelector('#custLine').innerHTML = custLine(); } dlg.showModal(); }, () => dlg.showModal());
  });
  // 複選欄位：勾選或輸入「其他」時，更新要儲存的值
  dlg.querySelectorAll('.mchk').forEach(box => {
    const upd = () => { const v = [...box.querySelectorAll('input[type=checkbox]:checked')].map(i => i.value).concat(prodTokens(box.querySelector('.mother').value)); form[box.dataset.for].value = [...new Set(v)].join(', '); };
    box.addEventListener('change', upd); box.querySelector('.mother').addEventListener('input', upd);
  });
  const drawFiles = () => { const fl = dlg.querySelector('#flist'); if (fl) fl.innerHTML = files.map((x, i) => `<span><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a><button type="button" class="x" data-i="${i}">✕</button></span>`).join(''); };
  drawFiles();
  dlg.querySelector('#flist')?.addEventListener('click', e => { const i = e.target.dataset.i; if (i !== undefined) { files.splice(Number(i), 1); drawFiles(); } });
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#cancel').addEventListener('click', close);
  dlg.addEventListener('cancel', () => dlg.remove());
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const data = {};
    for (const [f, t, type, req] of R.fields) {
      if (type === 'files') continue;
      data[f] = String(form[f].value || '').trim();
      if (req && !data[f]) return toast(`請填寫${t}`);
    }
    const saveBtn = dlg.querySelector('#save');
    saveBtn.disabled = true;
    try {
      const picker = form.querySelector('input[name=__files]');
      if (picker && picker.files.length) {
        saveBtn.textContent = '上傳中…';
        for (const f of picker.files) files.push(await uploadFile(f, R.kind, custNo(c) || c.leadNo || c.id));
      }
      if (R.fields.some(x => x[2] === 'files')) data.files = files;
      if (R.top) Object.assign(data, { customerId: target.id, customerName: target.name || '', customerNo: custNo(target), region: target.region || '' });
      if (k === 'demos' && cur.scheduleId) data.scheduleId = cur.scheduleId;
      if (editCreator && form.__creator) data.createdBy = form.__creator.value || 'system';
      if (k === 'demos' && !isAdmin() && !demoTypes().includes(data.type)) throw new Error('你不能填寫這種 Demo 紀錄');
      if (k === 'schedules' && data.endTime && data.endTime < data.startTime) throw new Error('結束時間不能早於開始時間');
      let newId = null;
      if (isNew) newId = (await addDoc(recCol(k, c), { ...data, createdBy: me.email, createdAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp() })).id;
      else if (!R.top && target.id !== c.id) {
        // 子紀錄換客戶：搬到新客戶底下，刪除舊的
        const { id: _id, customerId: _cid, ...old } = r;
        await moveSubRec(k, c.id, target.id, r.id, { ...old, ...data });
      }
      else await updateDoc(doc(recCol(k, c), r.id), { ...data, updatedBy: me.email, updatedAt: serverTimestamp() });
      close(); toast(target.id !== c.id ? `已儲存，並改連結到 ${target.name}` : '已儲存');
      if (target.id !== c.id) { recCache.delete(target.id); recsCache.clear(); }
      if (k === 'schedules') { schedCache.clear(); allSchedCache = null; if (isNew) notifySchedule(newId, data); }
      afterRecordChange(c);
    } catch (err) { toast(errMsg(err)); saveBtn.disabled = false; saveBtn.textContent = '儲存'; }
  });
  dlg.showModal();
}

          toast(`${dayDate} 已設為不算詢問`);

      return;

      }

      if (a === 'del') {

        await deleteDoc(doc(db, 'lineMsgs', m.id)); msgs = msgs.filter(y => y.id !== m.id); changed = true; draw();
      }
    } catch (err) { toast(errMsg(err)); }
  });

// ---------------- 維護到期追蹤（正式客戶：到期前 3 個月～過期 1 個月）----------------
const MAINT_ST = ['未追蹤', '追蹤中', '已報價', '已續約', '不續約'];
const MAINT_DONE = ['已續約', '不續約'];
// 維護日期統一成 YYYY-MM-DD（舊資料可能是 2026/1/5）
function normYmd(s) {
  const m = String(s || '').trim().match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : '';
}
const addMonthsYmd = (ymd, n) => { const d = toDate(ymd); d.setMonth(d.getMonth() + n); return ymdOf(d); };
// 這個狀態是針對目前的維護日期；改了維護日期就自動回到「未追蹤」
const maintStatus = c => (c.maintStatus && c.maintStatusFor === c.maintenanceDate) ? c.maintStatus : '未追蹤';
function maintInfo(c, today = ymdOf(new Date())) {
  if (!c || c.deleted || c.status !== 'formal') return null;
  const d = normYmd(c.maintenanceDate); if (!d) return null;
  const days = Math.round((toDate(d) - toDate(today)) / 864e5);
  const inWin = d >= addMonthsYmd(today, -1) && d <= addMonthsYmd(today, 3);
  return { date: d, days, inWin, status: maintStatus(c) };
}

function loadMonth(ym) {

    oldV.unsub?.(); schedLive.delete(oldK);

// 週檢視：左側時間軸（像 Google 日曆）
const WK_H = 60; // 每小時高度
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
function weekGrid(start, end, list, hol, today, chip) {
  const days = []; for (let d = new Date(start); d <= end; d = addDays(d, 1)) days.push(ymdOf(d));
  const timed = list.filter(x => x.startTime && endOf(x) === x.date);
  const allDay = list.filter(x => !x.startTime || endOf(x) !== x.date);
  const endMin = x => Math.max(x.endTime ? toMin(x.endTime) : toMin(x.startTime) + 60, toMin(x.startTime) + 30);
  let h0 = 8, h1 = 19;
  timed.forEach(x => { h0 = Math.min(h0, Math.floor(toMin(x.startTime) / 60)); h1 = Math.max(h1, Math.ceil(endMin(x) / 60)); });
  h1 = Math.min(h1, 24);
  const hours = []; for (let h = h0; h < h1; h++) hours.push(h);
  // 同時段重疊的行程並排
  const place = evs => {
    evs.sort((a, b) => toMin(a.startTime) - toMin(b.startTime) || endMin(b) - endMin(a));
    let group = [], colsEnd = [], gEnd = -1;
    const flush = () => { group.forEach(g => g.n = colsEnd.length); group = []; colsEnd = []; };
    return evs.map(x => {
      const s0 = toMin(x.startTime), e0 = endMin(x);
      if (s0 >= gEnd) { flush(); gEnd = -1; }
      let c = colsEnd.findIndex(e => e <= s0); if (c < 0) { c = colsEnd.length; colsEnd.push(e0); } else colsEnd[c] = e0;
      gEnd = Math.max(gEnd, e0);
      const o = { x, c, s0, e0 }; group.push(o); return o;
    }).map((o, i, arr) => { if (i === arr.length - 1) flush(); return o; });
  };
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const H = (h1 - h0) * WK_H;
  return `<div class="wk-wrap"><div class="wk">
    <div class="wk-row wk-head"><div class="wk-lab"></div>${days.map(d => { const dd = toDate(d); return `<div class="wk-dh ${d === today ? 'today' : ''}"><small>週${WD[dd.getDay()]}</small><b>${dd.getMonth() + 1}/${dd.getDate()}</b></div>`; }).join('')}</div>

async function viewCalSearch() {

        (await getDocsFromCache(base)).docs.forEach(d => {
          map.set(d.id, { id: d.id, ...d.data() });
          const u = d.data().updatedAt;
          if (!d.metadata.hasPendingWrites && u && (!max || u.toMillis() > max.toMillis())) max = u;
        });
      } catch (e) { /* 沒有快取就全部抓 */ }
      (await getDocs(max ? query(base, where('updatedAt', '>', max)) : base)).docs.forEach(d => map.set(d.id, { id: d.id, ...d.data() }));

    .filter(x => !cal.region || x.region === cal.region)

  const today = ymdOf(new Date());
  app.innerHTML = `<div class="card">
    <div class="toolbar"><h1 style="margin:0">行事曆搜尋</h1><span class="spacer"></span><button class="ghost" id="qBack">← 回行事曆</button></div>
    <div class="toolbar"><input id="cQ" value="${esc(cal.q)}" placeholder="🔍 搜尋全部行程" style="max-width:360px"><button id="qGo">搜尋</button>
      <span class="spacer"></span>
      <select id="cRegion"><option value="">全部區域</option>${REGIONS.map(r => `<option ${cal.region === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
      <select id="cPerson"><option value="">全部人員</option>${userOptions(['sales', 'manager', 'engineer', 'admin'], cal.person)}</select>
      <select id="cType"><option value="">全部類型</option>${Object.entries(SCHED_OPTS).map(([k, t]) => `<option value="${k}" ${cal.type === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </div>
    <div class="muted" style="margin-bottom:8px">找到 ${list.length} 筆（新到舊）。多個關鍵字用空白隔開＝全部都要符合</div>
    ${list.length ? `<div class="tablewrap"><table><thead><tr><th>日期</th><th>時間</th><th>標題</th><th>類型</th><th>區域</th><th>業務</th><th>工程師</th><th>地點</th></tr></thead><tbody class="click">
      ${list.map(x => `<tr data-sid="${esc(x.id)}" style="${endOf(x) < today ? 'color:#8a94a6' : ''}"><td>${esc(dateRangeText(x))}（${WD[toDate(x.date).getDay()]}）</td><td>${esc(timeText(x))}</td><td><span class="ev ${evColor(x)}">${esc(x.title)}</span></td><td>${SCHED_TYPE[x.type] || ''}</td><td>${esc(x.region)}</td><td>${esc(salesLabel(x.salesEmail))}</td><td>${esc(salesLabel(x.engineerEmail))}</td><td>${esc(x.place)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">找不到符合的行程</p>'}

// 從行程內容自動帶入潛在客戶欄位（「標籤：內容」格式的每一行）
const SCHED_LABELS = [
  ['name', ['客戶名稱', '客戶全稱', '公司名稱']],
  ['contact', ['聯絡窗口', '聯繫窗口', '聯絡人']],
  ['mobile', ['行動電話', '手機']],
  ['phone', ['聯絡電話', '電話']],
  ['address', ['公司地址', '地址']],
  ['companyProduct', ['公司產品']],
  ['currentSoftware', ['使用軟體', '公司軟體', '現用軟體']],
  ['industry', ['行業別']],
  ['email', ['E-Mail', 'Email', '信箱']],
  ['website', ['公司官網', '官網', '公司網址']]
];
function scheduleToCustomer(x) {
  const out = { status: 'potential', region: x.region || '', salesEmail: x.salesEmail || '' };
  for (const line of String(x.content || '').split('\n')) {
    const m = line.match(/^\s*([^：:]{1,12})\s*[：:]\s*(.+?)\s*$/);
    if (!m) continue;
    const hit = SCHED_LABELS.find(([, labels]) => labels.some(l => l.toLowerCase() === m[1].trim().toLowerCase()));
    if (!hit || out[hit[0]]) continue;
    out[hit[0]] = m[2];
  }
  // 「04-7683999 / 0981-315905」：09 開頭的拆到行動電話
  if (out.phone && /[\/／]/.test(out.phone)) {
    const parts = out.phone.split(/\s*[\/／]\s*/);
    const mob = parts.find(p => /^09/.test(p.replace(/\D/g, '')));
    if (mob && !out.mobile) { out.mobile = mob; out.phone = parts.filter(p => p !== mob).join(' / '); }
  }
  if (!out.address && x.place) out.address = x.place;
  if (!out.name) out.name = String(x.title || '').split(/[-－\[［(（]/)[0].trim();
  return out;
}

      <div class="field"><label>結束日期</label><input type="date" name="endDate" value="${esc(cur.endDate || '')}"><div class="muted">單日行程可留空</div></div>
      <div class="field"><label>開始時間</label>${timeInput('startTime', cur.startTime)}<div class="muted">留空＝全天</div></div>
      <div class="field"><label>結束時間</label>${timeInput('endTime', cur.endTime)}</div>
      <div class="field"><label>業務</label><select name="salesEmail"><option value="">（未指定）</option>${userOptions(['sales', 'manager'], cur.salesEmail)}</select></div>
      <div class="field"><label>工程師</label><select name="engineerEmail"><option value="">（未指定）</option>${userOptions(['engineer'], cur.engineerEmail)}</select></div>
      <div class="field full"><label>地點</label><input name="place" value="${esc(cur.place || '')}"></div>
      <div class="field full"><label>網址</label><input name="url" type="url" value="${esc(cur.url || '')}" placeholder="https://"></div>
      <div class="field full"><label>內容</label><textarea name="content" rows="8" placeholder="客戶名稱、聯絡窗口、電話、備註…">${esc(cur.content || '')}</textarea></div>
      <div class="field full">
        <div class="checks"><label><input type="checkbox" name="private" ${cur._private ? 'checked' : ''} ${!isNew && !r._private && r.createdBy !== me.email ? 'disabled' : ''}>🔒 私人行程（只有自己看得到；不寄信、不通知、不同步 Google 日曆）</label></div>
        ${!isNew && !r._private && isAdmin() ? `<div class="field" style="max-width:360px;margin-bottom:10px"><label>建立者（管理者可改）</label><select name="__creator">${userOptions(['sales', 'manager', 'engineer', 'admin'], r.createdBy)}</select></div>` : ''}
        <div class="checks" style="margin-top:6px" id="tentRow"><label><input type="checkbox" name="tentative" ${cur.tentative ? 'checked' : ''}>暫定（先不寄信、不通知、不同步 Google；之後取消勾選＝確定，那時才寄信）</label></div>
      </div>
    </div>
    <p class="muted" id="sfNote"></p>
    <div class="row-actions" style="margin-top:16px;justify-content:flex-end"><button type="button" class="ghost" id="cancel">取消</button><button type="submit" id="save">儲存</button></div></form>`;
  document.body.appendChild(dlg);
  const form = dlg.querySelector('#sf2');
  const note = () => {
    dlg.querySelector('#tentRow').classList.toggle('hidden', form.private.checked);
    dlg.querySelector('#sfNote').textContent = form.private.checked ? '私人行程只有你自己看得到。'
      : form.tentative.checked ? '暫定中：不會寄信或通知，也不會同步到 Google 日曆。'
      : (isNew || r?.tentative || r?._private) ? '儲存後會以系統通知＋Email 通知所選的業務、工程師。' : '';
  };
  form.private.addEventListener('change', note); form.tentative.addEventListener('change', note); note();
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#cancel').onclick = close;
  dlg.addEventListener('cancel', () => dlg.remove());
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const v = k => String(form[k].value || '').trim();
    const data = { title: v('title'), type: v('type'), region: v('region'), date: v('date'), endDate: v('endDate'), startTime: v('startTime'), endTime: v('endTime'),
      salesEmail: v('salesEmail'), engineerEmail: v('engineerEmail'), place: v('place'), url: v('url'), content: v('content') };
    if (!data.title) return toast('請填寫標題');
    if (!data.date) return toast('請選擇開始日期');
    if (data.endDate && data.endDate < data.date) return toast('結束日期不能早於開始日期');
    if (data.endDate === data.date) data.endDate = '';
    if (!data.endDate && data.startTime && data.endTime && data.endTime < data.startTime) return toast('結束時間不能早於開始時間');
    if (data.url && !/^https?:\/\//i.test(data.url)) data.url = 'https://' + data.url;
    const wantPriv = form.private.checked;
    data.tentative = !wantPriv && form.tentative.checked;
    dlg.querySelector('#save').disabled = true;
    const stamp = { updatedBy: me.email, updatedAt: serverTimestamp() };
    const newDoc = { createdBy: me.email, createdAt: serverTimestamp(), ...stamp };
    const wasPriv = !isNew && !!r._private;
    try {
      let id = r?.id;
      if (wantPriv) {
        // 私人行程：存在 privateSchedules，只有自己看得到
        if (wasPriv) await updateDoc(doc(db, 'privateSchedules', r.id), { ...data, ...stamp });
        else {
          await addDoc(collection(db, 'privateSchedules'), { ...data, owner: me.email, ...newDoc });
          if (!isNew) {
            await deleteDoc(doc(db, 'schedules', r.id));
            if (r.gcalId) callScript('gcalDelete', { scheduleId: r.id, eventId: r.gcalId }).catch(err => toast('Google 日曆刪除失敗：' + errMsg(err), 8000));
          }
        }
        close(); toast('已儲存（私人）'); refreshSchedViews(); return;
      }
      const confirmNow = !data.tentative && (isNew || wasPriv || r.tentative); // 這次才變成正式行程 → 寄信通知
      if (isNew || wasPriv) {
        id = (await addDoc(collection(db, 'schedules'), { ...data, ...newDoc })).id;
        if (wasPriv) await deleteDoc(doc(db, 'privateSchedules', r.id));
      } else await updateDoc(doc(db, 'schedules', r.id), { ...data, ...(form.__creator?.value ? { createdBy: form.__creator.value } : {}), ...stamp });
      close(); toast(data.tentative ? '已儲存（暫定，未通知）' : '已儲存'); refreshSchedViews();
      if (data.tentative) {
        if (!isNew && !wasPriv && r.gcalId) { // 改回暫定：從 Google 日曆拿掉
          callScript('gcalDelete', { scheduleId: r.id, eventId: r.gcalId }).then(() => updateDoc(doc(db, 'schedules', r.id), { gcalId: '' })).catch(err => toast('Google 日曆移除失敗：' + errMsg(err), 8000));
        }
        return;
      }
      if (confirmNow) notifySchedule(id, data);
      gcalSync([id]);
    } catch (err) { toast(errMsg(err)); dlg.querySelector('#save').disabled = false; }
  });
  dlg.showModal();
}

  const map = new Map(); let max = null;
  if (!full) {
    try {
      (await getDocsFromCache(base)).docs.forEach(d => {
        map.set(d.ref.path, toRow(d));
        const u = d.data().updatedAt;
        if (!d.metadata.hasPendingWrites && u && (!max || u.toMillis() > max.toMillis())) max = u;
      });
    } catch (e) { /* 沒有快取就全部抓 */ }
  }
  (await getDocs(max ? query(base, where('updatedAt', '>', max)) : base)).docs.forEach(d => map.set(d.ref.path, toRow(d)));
  const rows = [...map.values()];
  recsCache.set(key, rows);
  return rows;
}
async function loadRecsMonth(col, ym) {
  if (ym === 'all') return loadRecsAll(col);
  if (col === 'demos' && !isAdmin()) return (await loadRecsAll(col)).filter(r => String(r.date || '').startsWith(ym));
  const key = col + '|' + ym;
  if (recsCache.has(key)) return recsCache.get(key);
  const range = [where('date', '>=', ym + '-01'), where('date', '<=', ym + '-31')];
  const snap = await getDocs(col === 'demos' ? query(collection(db, 'demos'), ...range) : query(collectionGroup(db, col), ...range));
  const rows = snap.docs.map(toRow);
  recsCache.set(key, rows);
  return rows;
}

// 行程轉潛在客戶前：先找系統裡是不是已經有同一家，避免重複建立
const coreName = n => String(n || '').toLowerCase().replace(/股份有限公司|有限公司|股份|公司|企業社|企業|工業社|實業|\(.*?\)|（.*?）|\s|-/g, '');
const digits = v => String(v || '').replace(/\D/g, '');
function findSameCustomer(x, onLink, onNew) {
  const guess = scheduleToCustomer(x);
  const kw0 = guess.name || String(x.title || '').split(/[-－_\[［(（]/)[0].trim();
  const phones = [guess.phone, guess.mobile].map(digits).filter(p => p.length >= 7);
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<h1>轉為潛在客戶：先確認有沒有重複</h1>
    <p class="muted">依行程標題、內容裡的客戶名稱與電話，找出系統裡可能是同一家的客戶。是同一家就直接連結，不會新增。</p>
    <input id="fq" value="${esc(kw0)}" placeholder="輸入客戶名稱、編號、聯絡人、電話搜尋"><div class="pick" id="flist"></div>
    <div class="row-actions" style="margin-top:16px;justify-content:flex-end"><button class="ghost" id="fc">取消</button><button class="accent" id="fn">都不是，新增潛在客戶</button></div>`;
  document.body.appendChild(dlg);
  const draw = () => {
    const q = dlg.querySelector('#fq').value.trim().toLowerCase(), cq = coreName(q), dq = digits(q);
    const score = c => {
      const cn = coreName(c.name);
      let sc = 0;
      if (cq && cn && (cn.includes(cq) || cq.includes(cn))) sc += cn === cq ? 3 : 2;
      if (q && [custNo(c), c.leadNo, c.formalNo, c.name, c.contact].some(v => String(v || '').toLowerCase().includes(q))) sc += 1;
      const cp = [c.phone, c.mobile].map(digits);
      if ((dq.length >= 7 && cp.some(p => p.includes(dq))) || phones.some(p => cp.some(v => v && (v.includes(p) || p.includes(v))))) sc += 3;
      return sc;
    };
    const list = [...customers.values()].filter(c => !c.deleted && c.id !== UNLINKED_ID).map(c => [score(c), c]).filter(([sc]) => sc > 0)
      .sort((a, b) => b[0] - a[0] || String(a[1].name).localeCompare(String(b[1].name), 'zh-Hant')).slice(0, 30);
    dlg.querySelector('#flist').innerHTML = list.map(([sc, c]) => `<div data-id="${esc(c.id)}" style="display:flex;gap:10px;align-items:center">
      <div style="flex:1"><strong>${esc(custNo(c))}</strong>　${esc(c.name)} <span class="tag ${c.status === 'formal' ? 'formal' : 'potential'}">${c.status === 'formal' ? '正式' : '潛在'}</span>
      <div class="muted">${[c.region, salesLabel(c.salesEmail), c.contact, c.phone].filter(Boolean).map(esc).join(' · ')}</div></div>
      ${sc >= 3 ? '<span class="pill tent">很可能同一家</span>' : ''}<button class="ghost small">連結這位</button></div>`).join('') || '<p class="muted">找不到相似的客戶，可以放心新增。</p>';
  };
  draw();
  dlg.querySelector('#fq').addEventListener('input', draw);
  const done = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#fc').onclick = done;
  dlg.addEventListener('cancel', () => dlg.remove());
  dlg.querySelector('#fn').onclick = () => { done(); onNew(); };
  dlg.querySelector('#flist').addEventListener('click', e => {
    const id = e.target.closest('[data-id]')?.dataset.id; if (!id) return;
    const c = customers.get(id);
    if (!confirm(`把這個行程連結到「${custNo(c)} ${c.name}」？\n不會新增客戶。`)) return;
    done(); onLink(c);
  });
  dlg.showModal();
}
function pickCustomer(cb, onCancel) {
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<h1>選擇客戶</h1><input id="pq" placeholder="輸入名稱、編號、聯絡人搜尋（潛在、正式客戶都可選）"><div class="pick" id="plist"></div>
    <div class="row-actions" style="margin-top:16px;justify-content:flex-end"><button class="ghost" id="pc">取消</button></div>`;
  document.body.appendChild(dlg);
  const draw = () => {
    const q = dlg.querySelector('#pq').value.trim().toLowerCase();

      .filter(c => !q || [custNo(c), c.leadNo, c.formalNo, c.name, c.contact].some(v => String(v || '').toLowerCase().includes(q)))
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant')).slice(0, 50);
    dlg.querySelector('#plist').innerHTML = list.map(c => `<div data-id="${esc(c.id)}"><strong>${esc(custNo(c))}</strong>　${esc(c.name)} <span class="tag ${c.status === 'formal' ? 'formal' : 'potential'}">${c.status === 'formal' ? '正式' : '潛在'}</span> <span class="muted">${esc(c.region)}</span></div>`).join('') || '<p class="muted">找不到客戶</p>';
  };
  draw();
  dlg.querySelector('#pq').addEventListener('input', draw);
  dlg.querySelector('#pc').onclick = () => { dlg.close(); dlg.remove(); onCancel?.(); };
  dlg.addEventListener('cancel', () => { dlg.remove(); onCancel?.(); });
  dlg.querySelector('#plist').addEventListener('click', e => {
    const id = e.target.closest('[data-id]')?.dataset.id; if (!id) return;
    dlg.close(); dlg.remove();
    cb(customers.get(id));
  });
  dlg.showModal();
  dlg.querySelector('#pq').focus();
}

// ---- 範本 ----
let qTplCache = null;
async function loadQTpl(force) {
  if (qTplCache && !force) return qTplCache;
  const s = await getDocs(collection(db, 'quoteTemplates'));
  qTplCache = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  return qTplCache;
}
const qTplOptions = (list, sel) => {
  const g = {}; list.forEach(t => (g[t.group || '其他'] = g[t.group || '其他'] || []).push(t));
  return Object.entries(g).map(([k, a]) => `<optgroup label="${esc(k)}">${a.map(t => `<option value="${esc(t.id)}" ${t.id === sel ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('');
};
const qCopyItems = items => (items || []).map(x => ({ partNo: x.partNo || '', name: x.name || '', desc: Array.isArray(x.desc) ? x.desc.join('\n') : (x.desc || ''), price: qNum(x.price), qty: x.qty ?? 1, disc: x.disc ?? qNum(x.price) }));
const qTermsText = t => Array.isArray(t) ? t.join('\n') : (t || '');
function qCatalog() {
  const out = [], seen = new Set();
  (qTplCache || []).forEach(t => (t.items || []).forEach(it => { const k = it.partNo + '|' + it.name + '|' + it.price; if (!seen.has(k)) { seen.add(k); out.push(it); } }));
  return out;
}

// 產品項目編輯器（報價單與範本共用）
function qItemsEditor(box, items, onChange) {
  const draw = () => {
    box.innerHTML = items.map((x, i) => `<div class="qitem" data-i="${i}">
      <div class="qtop"><b>${i + 1}.</b><input data-k="partNo" value="${esc(x.partNo)}" placeholder="產品料號">
        <button type="button" class="small ghost" data-a="up" title="上移">↑</button><button type="button" class="small ghost" data-a="down" title="下移">↓</button><button type="button" class="small danger" data-a="del" title="刪除">✕</button></div>
      <input data-k="name" value="${esc(x.name)}" placeholder="產品名稱及版本規格">
      <textarea data-k="desc" rows="${Math.min(8, Math.max(2, String(x.desc || '').split('\n').length))}" placeholder="規格說明（一行一項）">${esc(x.desc)}</textarea>
      <div class="q3"><div class="field"><label>單價</label><input data-k="price" type="number" value="${esc(x.price)}"></div>
        <div class="field"><label>數量</label><input data-k="qty" type="number" min="0" value="${esc(x.qty)}"></div>
        <div class="field"><label>優惠單價</label><input data-k="disc" type="number" value="${esc(x.disc)}"></div></div></div>`).join('') || '<p class="muted">尚無項目</p>';
  };
  box.oninput = e => {
    const k = e.target.dataset.k; if (!k) return;
    const el = e.target.closest('.qitem'); const i = +el.dataset.i; const v = e.target.value;
    if (k === 'price') { const old = items[i].price; items[i].price = qNum(v); if (qNum(items[i].disc) === qNum(old)) { items[i].disc = items[i].price; el.querySelector('[data-k=disc]').value = items[i].disc; } }
    else items[i][k] = ['qty', 'disc'].includes(k) ? qNum(v) : v;
    onChange();
  };
  box.onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    const i = +e.target.closest('.qitem').dataset.i;
    if (a === 'del') items.splice(i, 1);
    if (a === 'up' && i > 0) [items[i - 1], items[i]] = [items[i], items[i - 1]];
    if (a === 'down' && i < items.length - 1) [items[i + 1], items[i]] = [items[i], items[i + 1]];
    draw(); onChange();
  };
  draw();
  return { draw, add(it) { items.push(it); draw(); onChange(); } };
}
