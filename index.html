async function viewQuotes() {
  app.innerHTML = '<div class="card"><p class="muted">載入報價單中…</p></div>';
  let list;
  try { list = (await getDocs(collection(db, 'quotes'))).docs.map(d => ({ id: d.id, ...d.data() })); }
  catch (e) { app.innerHTML = `<div class="card"><p>報價單載入失敗：${esc(errMsg(e))}</p><p class="muted">如果是「權限不足」，請確認 Firebase 規則已發布（tmic-crm 專案）。</p></div>`; return; }
  const latest = qLatest(list);
  app.innerHTML = `<div class="card"><h1>報價單</h1>
    <div class="toolbar"><input id="qq" placeholder="搜尋客戶、報價單號、內容"><select id="qs"><option value="">全部狀態</option><option value="signed">已簽回</option><option value="open">未簽回</option></select>
      <span class="spacer"></span><button class="ghost" id="qtpl">報價範本</button><button id="qadd">＋ 新增報價單</button></div>
    <div class="muted" id="qcount"></div>
    <div class="tablewrap"><table><thead><tr><th>報價日期</th><th>報價單號</th><th>客戶</th><th>內容</th><th>版本</th><th>業務窗口</th><th>總計（含稅）</th><th>狀態</th></tr></thead><tbody id="qbody" class="click"></tbody></table></div></div>`;
  const draw = () => {
    const q = $('#qq').value.trim().toLowerCase(), s = $('#qs').value;
    const rows = latest.filter(x => !q || [x.customerName, x.qNo, x.title, x.cName].some(v => String(v || '').toLowerCase().includes(q)))
      .filter(x => !s || (s === 'signed') === !!(x._signedAny));
    $('#qcount').textContent = `共 ${rows.length} 份（每份顯示最新版本）`;
    $('#qbody').innerHTML = rows.map(x => `<tr data-id="${esc(x.id)}"><td>${esc(x.qDate)}</td><td>${esc(x.qNo)}</td><td>${esc(x.customerName || x.cName)}</td><td>${esc(x.title)}</td>
      <td>${qVer(x)}${x._count > 1 ? `<span class="muted">（共 ${x._count} 版）</span>` : ''}</td><td>${esc(x.sName)}</td><td>${qMoney(qTax(x))}</td>
      <td>${x._signedAny ? '<span class="tag formal">已簽回</span>' : '<span class="muted">未簽回</span>'}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">還沒有報價單</td></tr>';
  };
  draw();
  $('#qq').oninput = draw; $('#qs').onchange = draw;
  $('#qbody').onclick = e => { const id = e.target.closest('[data-id]')?.dataset.id; if (id) location.hash = '#/quote/' + id; };
  $('#qadd').onclick = () => qNew();
  $('#qtpl').onclick = () => { location.hash = '#/quotes/tpl'; };
}
// 每組報價只取最新版本；_signedAny＝任一版本已簽回
function qLatest(list) {
  const g = new Map();
  list.forEach(x => { const k = x.groupId || x.id; (g.get(k) || g.set(k, []).get(k)).push(x); });
  return [...g.values()].map(a => {
    a.sort((p, q) => (q.ver || 1) - (p.ver || 1));
    return { ...a[0], _count: a.length, _signedAny: a.some(v => (v.signed || []).length) };
  }).sort((p, q) => String(q.qDate || '').localeCompare(String(p.qDate || '')));
}

// ---- 新增 ----
let qDraft = null;
async function qNew(c) {
  if (!c) return pickCustomer(x => qNew(x));
  let tpls;
  try { tpls = await loadQTpl(); } catch (e) { return toast('範本載入失敗：' + errMsg(e)); }
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<h1>新增報價單</h1><p>客戶：<strong>${esc(custNo(c))}　${esc(c.name)}</strong></p>
    <div class="field"><label>選擇範本</label><select id="nt">${tpls.length ? qTplOptions(tpls) : ''}<option value="">（空白報價單）</option></select></div>
    ${tpls.length ? '' : '<p class="muted">還沒有範本，可到「報價單 → 報價範本」匯入。</p>'}
    <div class="row-actions" style="margin-top:16px;justify-content:flex-end"><button class="ghost" id="nc">取消</button><button id="ng">建立</button></div>`;
  document.body.appendChild(dlg);
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#nc').onclick = close; dlg.addEventListener('cancel', () => dlg.remove());
  dlg.querySelector('#ng').onclick = () => {
    const t = tpls.find(x => x.id === dlg.querySelector('#nt').value);
    const sales = c.salesEmail && users.get(c.salesEmail) ? c.salesEmail : (['sales', 'manager'].includes(me.role) ? me.email : '');
    qDraft = { customerId: c.id, customerName: c.name || '', customerNo: custNo(c) || c.leadNo || '', region: c.region || '',
      title: t ? t.name : '自訂報價', tplId: t ? t.id : '', qNo: '', qDate: ymdOf(new Date()),
      cName: c.name || '', cContact: c.contact || '', cTel: c.phone || c.mobile || '', cFax: c.fax || '',
      salesEmail: sales, sName: qSalesName(sales), sMail: qMail(sales),
      pay: t ? t.payment || '' : '合約簽定，貨到一次付清(即期支票)。', terms: t ? qTermsText(t.terms) : '', cancel: t?.cancel || Q_CANCEL,
      items: t ? qCopyItems(t.items) : [], wmOn: true, wmText: '明日國際 TMIC', stampOn: true, ver: 1, signed: [] };
    close(); location.hash = '#/quote/new';
  };
  dlg.showModal();
}

      <div class="field full"><label>付款條件</label><input data-f="pay" value="${esc(q.pay)}" list="qpaylist"><datalist id="qpaylist">${[...new Set(tpls.map(t => t.payment).filter(Boolean))].map(p => `<option value="${esc(p)}">`).join('')}</datalist></div>

    <div class="card"><div class="sec-head"><h2 style="margin:0">產品項目</h2><span class="spacer"></span><button class="small ghost" id="qblank">＋空白項目</button></div>
      <div id="qitems"></div>
      <div class="field"><label>從產品庫加入</label><select id="qcat"><option value="">— 選擇產品 —</option>${qCatalog().map((it, i) => `<option value="${i}">${esc(it.partNo)}｜${esc(it.name)}｜${qMoney(it.price)}</option>`).join('')}</select></div>
      ${tpls.length ? `<div class="field" style="margin-top:8px"><label>套用其他範本（會取代項目、付款條件、報價說明）</label><select id="qapply"><option value="">— 選擇範本 —</option>${qTplOptions(tpls)}</select></div>` : ''}
    </div>
    <div class="card"><h2>報價說明</h2><textarea data-f="terms" rows="5">${esc(q.terms)}</textarea><div class="muted">一行一條，會自動編號。</div></div>
    <div class="card"><h2>浮水印與用印</h2>
      <label class="chk"><input type="checkbox" id="qwm" ${q.wmOn !== false ? 'checked' : ''}> 顯示浮水印</label>
      <div class="field"><label>浮水印文字</label><input data-f="wmText" value="${esc(q.wmText ?? '明日國際 TMIC')}"></div>
      <label class="chk"><input type="checkbox" id="qstamp" ${q.stampOn !== false ? 'checked' : ''}> 蓋「報價專用章」</label>
    </div>
  </div>
  <div class="qstage"><div id="qpaper"></div></div></div>`;

  const setDirty = v => { dirty = v; $('#qdirty').textContent = v ? '● 尚未儲存' : ''; };
  const paint = () => {
    const a = qPaperAttrs(q), p = $('#qpaper'); if (!p) return;
    p.className = a.cls; p.setAttribute('style', a.style); p.innerHTML = qPaperHtml(q);
    const w = p.parentElement.clientWidth, full = 210 * 96 / 25.4;
    p.style.zoom = w < full + 10 ? Math.max(.35, (w - 10) / full) : 1;
  };
  const changed = () => { setDirty(true); paint(); };
  const drawSigned = () => {
    $('#qsigned').innerHTML = q.signed.length ? q.signed.map((f, i) => `<div class="qfile"><a href="${esc(f.url)}" target="_blank" rel="noopener">📄 ${esc(f.name)}</a><span class="muted">${esc(f.at || '')}</span><button class="small ghost" data-rm="${i}">移除</button></div>`).join('') : '<p class="muted">尚未上傳</p>';
  };
  setDirty(dirty); paint(); drawSigned();
  const ed = qItemsEditor($('#qitems'), q.items, changed);
  app.querySelectorAll('[data-f]').forEach(el => el.addEventListener('input', () => { q[el.dataset.f] = el.value; changed(); }));
  $('#qsales').onchange = e => { q.salesEmail = e.target.value; q.sName = qSalesName(q.salesEmail); q.sMail = qMail(q.salesEmail); app.querySelector('[data-f=sMail]').value = q.sMail; changed(); };
  $('#qwm').onchange = e => { q.wmOn = e.target.checked; changed(); };
  $('#qstamp').onchange = e => { q.stampOn = e.target.checked; changed(); };
  $('#qblank').onclick = () => ed.add({ partNo: '', name: '', desc: '', price: 0, qty: 1, disc: 0 });
  $('#qcat').onchange = e => { const it = qCatalog()[e.target.value]; if (it) ed.add(qCopyItems([it])[0]); e.target.value = ''; };
  $('#qapply')?.addEventListener('change', e => {
    const t = tpls.find(x => x.id === e.target.value); e.target.value = ''; if (!t) return;
    if (!confirm(`改用「${t.name}」？目前的產品項目、付款條件、報價說明會被取代。`)) return;
    q.items.splice(0, q.items.length, ...qCopyItems(t.items)); q.pay = t.payment || ''; q.terms = qTermsText(t.terms); q.cancel = t.cancel || Q_CANCEL; q.title = t.name; q.tplId = t.id;
    app.querySelector('[data-f=pay]').value = q.pay; app.querySelector('[data-f=terms]').value = q.terms; ed.draw(); changed();
  });
  $('#qcust').onclick = () => pickCustomer(c => {
    Object.assign(q, { customerId: c.id, customerName: c.name || '', customerNo: custNo(c) || c.leadNo || '', region: c.region || '', cName: c.name || '', cContact: c.contact || '', cTel: c.phone || c.mobile || '', cFax: c.fax || '' });
    ['cName', 'cContact', 'cTel', 'cFax'].forEach(k => { app.querySelector(`[data-f=${k}]`).value = q[k]; });
    app.querySelector('.qpanel h2').textContent = q.customerName; changed();
  });
  const payload = () => {
    const o = {}; ['customerId', 'customerName', 'customerNo', 'region', 'title', 'tplId', 'qNo', 'qDate', 'cName', 'cContact', 'cTel', 'cFax', 'salesEmail', 'sName', 'sMail', 'pay', 'terms', 'cancel', 'wmText'].forEach(k => { o[k] = q[k] ?? ''; });
    o.items = q.items.map(x => ({ partNo: x.partNo || '', name: x.name || '', desc: x.desc || '', price: qNum(x.price), qty: qNum(x.qty), disc: qNum(x.disc) }));
    o.wmOn = q.wmOn !== false; o.stampOn = q.stampOn !== false; o.total = qSum(q); o.totalTax = qTax(q);
    return o;
  };
  const save = async () => {
    const stamp = { updatedBy: me.email, updatedAt: serverTimestamp() };
    if (isNew) {
      const ref = doc(collection(db, 'quotes'));
      await setDoc(ref, { ...payload(), groupId: ref.id, ver: 1, signed: [], createdBy: me.email, createdAt: serverTimestamp(), ...stamp });
      qDraft = null; return ref.id;
    }
    await updateDoc(doc(db, 'quotes', q.id), { ...payload(), ...stamp });
    return q.id;
  };
  $('#qsave').onclick = async e => {
    e.target.disabled = true;
    try { const nid = await save(); setDirty(false); toast('已儲存'); if (isNew) location.hash = '#/quote/' + nid; }
    catch (err) { toast('儲存失敗：' + errMsg(err), 6000); } finally { e.target.disabled = false; }
  };
  $('#qnewver')?.addEventListener('click', async e => {
    if (!confirm(`以目前畫面的內容另存成 v${Math.max(...versions.map(v => v.ver || 1), q.ver || 1) + 1}？（${qVer(q)} 保持不變${dirty ? '，這次的修改只會存到新版本' : ''}）`)) return;
    e.target.disabled = true;
    try {
      const ver = Math.max(...versions.map(v => v.ver || 1), q.ver || 1) + 1;
      const ref = doc(collection(db, 'quotes'));
      await setDoc(ref, { ...payload(), groupId: q.groupId || q.id, ver, signed: [], createdBy: me.email, createdAt: serverTimestamp(), updatedBy: me.email, updatedAt: serverTimestamp() });
      toast(`已另存為 v${ver}`); location.hash = '#/quote/' + ref.id;
    } catch (err) { toast('另存失敗：' + errMsg(err), 6000); e.target.disabled = false; }
  });
  $('#qprint').onclick = () => qPrint(q);
  $('#qdel')?.addEventListener('click', async () => {
    if (!confirm(`確定刪除 ${qVer(q)}？${q.signed.length ? '\n（這個版本有簽回掃描檔，雲端檔案不會被刪，但這裡的連結會消失）' : ''}`)) return;
    try {
      await deleteDoc(doc(db, 'quotes', q.id)); toast('已刪除');
      const rest = versions.filter(v => v.id !== q.id);
      location.hash = rest.length ? '#/quote/' + rest[0].id : '#/quotes';
    } catch (err) { toast('刪除失敗：' + errMsg(err), 6000); }
  });
  $('#qup').onchange = async e => {
    const files = [...e.target.files]; if (!files.length) return;
    if (isNew || dirty) { if (!confirm('上傳前需要先儲存目前內容，要儲存嗎？')) { e.target.value = ''; return; } }
    try {
      let qid = q.id;
      if (isNew || dirty) { qid = await save(); setDirty(false); }
      toast('上傳中…', 20000);
      for (const f of files) {
        const r = await uploadFile(f, 'purchase', q.customerNo || q.customerId || '未編號');
        q.signed.push({ name: r.name, url: r.url, at: ymdOf(new Date()), by: me.email });
      }
      await updateDoc(doc(db, 'quotes', qid), { signed: q.signed, updatedBy: me.email, updatedAt: serverTimestamp() });
      toast('已上傳'); if (isNew) location.hash = '#/quote/' + qid; else drawSigned();
    } catch (err) { toast('上傳失敗：' + errMsg(err), 8000); }
    e.target.value = '';
  };
  $('#qsigned').onclick = async e => {
    const i = e.target.dataset.rm; if (i === undefined) return;
    if (!confirm(`移除「${q.signed[i].name}」的連結？（雲端上的檔案不會被刪）`)) return;
    const next = q.signed.filter((_, j) => j !== +i);
    try { await updateDoc(doc(db, 'quotes', q.id), { signed: next, updatedBy: me.email, updatedAt: serverTimestamp() }); q.signed = next; drawSigned(); toast('已移除'); }
    catch (err) { toast(errMsg(err)); }
  };
  window.addEventListener('resize', paint, { once: true });
}

// ---- 報價範本管理 ----
async function viewQuoteTpls() {
  app.innerHTML = '<div class="card"><p class="muted">載入範本中…</p></div>';
  let list;
  try { list = await loadQTpl(true); } catch (e) { app.innerHTML = `<div class="card"><p>範本載入失敗：${esc(errMsg(e))}</p></div>`; return; }
  const g = {}; list.forEach(t => (g[t.group || '其他'] = g[t.group || '其他'] || []).push(t));
  app.innerHTML = `<div class="custnav"><a href="#/quotes">← 報價單列表</a></div><div class="card"><h1>報價範本</h1>
    <p class="muted">範本的產品、價格、規格說明、付款條件、報價說明都可以改。新增報價單時選範本，就會帶入這些內容；「產品庫」是所有範本裡的產品整理出來的。改範本不會影響已經建立的報價單。</p>
    <div class="toolbar"><button id="tAdd">＋ 新增範本</button><label class="ghost" style="display:inline-flex;align-items:center;gap:6px">匯入範本 JSON：<input type="file" id="tImp" accept=".json,application/json" style="max-width:240px"></label></div>
    ${Object.entries(g).map(([k, a]) => `<h2 style="margin-top:18px">${esc(k)}</h2><div class="tablewrap"><table><thead><tr><th>範本名稱</th><th>項目</th><th>合計（未稅）</th><th></th></tr></thead><tbody>${a.map(t => `<tr data-id="${esc(t.id)}"><td>${esc(t.name)}</td><td>${(t.items || []).map(x => esc(x.partNo)).join('、')}</td><td>${qMoney(qSum(t))}</td>
      <td class="row-actions"><button class="small ghost" data-a="edit">編輯</button><button class="small ghost" data-a="copy">複製</button><button class="small danger" data-a="del">刪除</button></td></tr>`).join('')}</tbody></table></div>`).join('') || '<p class="muted">還沒有範本。請用上面的「匯入範本 JSON」匯入 Claude 給你的 quote_templates.json。</p>'}</div>`;
  $('#tAdd').onclick = () => qTplForm(null);
  app.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', async e => {
    const a = e.target.dataset.a; if (!a) return;
    const t = list.find(x => x.id === tr.dataset.id);
    if (a === 'edit') qTplForm(t);
    if (a === 'copy') qTplForm({ ...t, id: null, name: t.name + '（複製）' });
    if (a === 'del') {
      if (!confirm(`確定刪除範本「${t.name}」？（已建立的報價單不受影響）`)) return;
      try { await deleteDoc(doc(db, 'quoteTemplates', t.id)); toast('已刪除'); viewQuoteTpls(); } catch (err) { toast(errMsg(err)); }
    }
  }));
  $('#tImp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    let arr;
    try { arr = JSON.parse(await f.text()); if (!Array.isArray(arr)) throw new Error('格式不對'); } catch (err) { toast('檔案讀取失敗：' + errMsg(err)); e.target.value = ''; return; }
    const exist = new Set(list.map(t => (t.group || '') + '|' + t.name));
    const add = arr.filter(t => t && t.name && !exist.has((t.group || '') + '|' + t.name));
    if (!add.length) { toast('沒有新的範本（同名的已略過）'); e.target.value = ''; return; }
    if (!confirm(`要匯入 ${add.length} 個範本嗎？${arr.length - add.length ? `（${arr.length - add.length} 個同名的會略過）` : ''}`)) { e.target.value = ''; return; }
    try {
      let order = list.reduce((m, t) => Math.max(m, t.order ?? 0), 0);
      for (let i = 0; i < add.length; i += 400) {
        const b = writeBatch(db);
        add.slice(i, i + 400).forEach(t => b.set(doc(collection(db, 'quoteTemplates')), { group: t.group || '其他', name: t.name, order: ++order, payment: t.payment || '', terms: qTermsText(t.terms), cancel: t.cancel || Q_CANCEL, items: qCopyItems(t.items), updatedBy: me.email, updatedAt: serverTimestamp() }));
        await b.commit();
      }
      toast(`已匯入 ${add.length} 個範本`); viewQuoteTpls();
    } catch (err) { toast('匯入失敗：' + errMsg(err), 8000); }
  };
}
function qTplForm(t) {
  const isNew = !t?.id;
  const cur = { group: t?.group || '', name: t?.name || '', payment: t?.payment || '合約簽定，貨到一次付清(即期支票)。', terms: qTermsText(t?.terms), cancel: t?.cancel || Q_CANCEL, items: qCopyItems(t?.items) };
  const groups = [...new Set((qTplCache || []).map(x => x.group).filter(Boolean))];
  const dlg = document.createElement('dialog'); dlg.className = 'wide';
  dlg.innerHTML = `<form><h1>${isNew ? '新增範本' : '編輯範本'}</h1><div class="grid">
      <div class="field"><label>分類</label><input name="group" value="${esc(cur.group)}" list="tg"><datalist id="tg">${groups.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div class="field"><label>範本名稱 *</label><input name="name" value="${esc(cur.name)}"></div>
      <div class="field full"><label>付款條件</label><input name="payment" value="${esc(cur.payment)}"></div>
      <div class="field full"><label>報價說明（一行一條）</label><textarea name="terms" rows="4">${esc(cur.terms)}</textarea></div>
      <div class="field full"><label>訂單簽回說明</label><textarea name="cancel" rows="2">${esc(cur.cancel)}</textarea></div></div>
    <div class="sec-head" style="margin-top:14px"><h2 style="margin:0">產品項目</h2><span class="spacer"></span><button type="button" class="small ghost" id="tb">＋空白項目</button></div>
    <div id="ti"></div>
    <div class="row-actions" style="margin-top:16px;justify-content:flex-end"><button type="button" class="ghost" id="tc">取消</button><button type="submit">儲存</button></div></form>`;
  document.body.appendChild(dlg);
  const ed = qItemsEditor(dlg.querySelector('#ti'), cur.items, () => {});
  dlg.querySelector('#tb').onclick = () => ed.add({ partNo: '', name: '', desc: '', price: 0, qty: 1, disc: 0 });
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#tc').onclick = close; dlg.addEventListener('cancel', () => dlg.remove());
  dlg.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, name = f.name.value.trim(); if (!name) return toast('請填範本名稱');
    const data = { group: f.group.value.trim() || '其他', name, payment: f.payment.value.trim(), terms: f.terms.value, cancel: f.cancel.value.trim(),
      items: cur.items.map(x => ({ partNo: x.partNo || '', name: x.name || '', desc: x.desc || '', price: qNum(x.price), qty: qNum(x.qty), disc: qNum(x.disc) })), updatedBy: me.email, updatedAt: serverTimestamp() };
    try {
      if (isNew) await addDoc(collection(db, 'quoteTemplates'), { ...data, order: (qTplCache || []).reduce((m, x) => Math.max(m, x.order ?? 0), 0) + 1 });
      else await updateDoc(doc(db, 'quoteTemplates', t.id), data);
      close(); toast('已儲存'); viewQuoteTpls();
    } catch (err) { toast('儲存失敗：' + errMsg(err), 6000); }
  };
  dlg.showModal();
}

function parseGcalEvent(e) {
  const title = e.title || '';
  const found = [];
  for (const u of users.values()) {
    if (!u.nameEn || u.active === false) continue;
    const re = new RegExp('(^|[^A-Za-z])' + u.nameEn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z])', 'i');
    const m = title.match(re); if (m) found.push([m.index, u]);
  }
  found.sort((a, b) => a[0] - b[0]);
  const isSales = u => ['sales', 'manager'].includes(u.role) || u.alsoSales;
  const isEng = u => u.role === 'engineer' || u.alsoEngineer;
  const sales = found.map(x => x[1]).find(isSales);
  const eng = found.map(x => x[1]).find(u => u !== sales && isEng(u));
  let type = 'other';
  if (/休|假/.test(title)) type = 'leave';
  else if (/上課|課程|教育訓練/.test(title)) type = 'class';
  else if (/demo/i.test(title)) type = 'demo';
  else if (/裝機|交貨|安裝/.test(title)) type = 'install';
  else if (/技術支援|技術支持|遠端/.test(title)) type = 'support';
  const regOf = u => u ? (userRegions(u).length === 1 ? userRegions(u)[0] : '') : '';
  const region = regOf(sales) || regOf(eng) || (['9', '1'].includes(e.color) ? '台北' : '');
  const content = String(e.content || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
  return { title, type, region, date: e.date, endDate: e.endDate, startTime: e.startTime, endTime: e.endTime, salesEmail: sales?.email || '', engineerEmail: eng?.email || '', place: e.place, url: '', content,
    gcalId: e.eventId, gcalSkip: !!e.recurring, source: 'gcal' };
}

    if (a === 'edit') userForm(u);
    if (a === 'cust') { e.preventDefault(); ui.sales = '__left'; ui.status = 'all'; location.hash = '#/customers'; return; }
    if (a === 'del') {
      const n = [...customers.values()].filter(c => !c.deleted && c.salesEmail === email).length;
      if (n && !confirm(`${salesLabel(email)} 目前仍負責 ${n} 位客戶，刪除後這些客戶的負責業務會變成無法辨識。\n\n建議改用「編輯 → 狀態：離職」保留此人。\n\n仍要刪除嗎？`)) return;
      if (!confirm(`確定刪除 ${salesLabel(email)}（${email}）？刪除後此人立即無法登入。`)) return;
      try { await deleteDoc(doc(db, 'users', email)); toast('已刪除'); } catch (err) { toast(errMsg(err)); }
    }
  });
}

// 更換 Google 帳號：把所有指向舊帳號的欄位改成新帳號
async function moveUserRefs(oldE, newE) {
  const FIELDS = ['salesEmail', 'engineerEmail', 'createdBy'];
  const jobs = [];
  const scan = d => {
    const x = d.data(), upd = {};
    FIELDS.forEach(f => { if (x[f] === oldE) upd[f] = newE; });
    if (Object.keys(upd).length) jobs.push([d.ref, { ...upd, updatedBy: me.email, updatedAt: serverTimestamp() }]);
  };
  const sources = [collection(db, 'customers'), collection(db, 'demos'), collection(db, 'schedules'), collectionGroup(db, 'purchases'), collectionGroup(db, 'issues'), collectionGroup(db, 'installs')];
  for (const src of sources) (await getDocs(src)).docs.forEach(scan);
  for (let i = 0; i < jobs.length; i += 200) {
    const b = writeBatch(db);
    jobs.slice(i, i + 200).forEach(([ref, upd]) => b.update(ref, upd));
    await b.commit();
  }
  return jobs.length;
}

function userForm(u) {
  const isNew = !u;
  const cur = u || { role: 'sales', regions: [] };
  const curRegs = userRegions(cur);
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<form id="uf"><h1>${isNew ? '新增人員' : '編輯人員'}</h1>
    <div class="grid">
      <div class="field"><label>Google 帳號（Gmail，登入用）*</label><input name="email" type="email" value="${esc(cur.email)}"></div>
      <div class="field"><label>公司信箱</label><input name="companyEmail" type="email" value="${esc(cur.companyEmail)}" placeholder="例：name@tmic.asia"></div>
      <div class="field"><label>通知信寄到</label><div class="checks"><label><input type="checkbox" name="notifyGmail" ${cur.notifyGmail !== false ? 'checked' : ''}>Gmail</label><label><input type="checkbox" name="notifyCompany" ${cur.notifyCompany ? 'checked' : ''}>公司信箱</label></div><div class="muted">兩個都勾就兩邊都寄</div></div>
      <div class="field"><label>中文名 *</label><input name="nameZh" value="${esc(cur.nameZh)}"></div>
      <div class="field"><label>英文名</label><input name="nameEn" value="${esc(cur.nameEn)}"></div>
      <div class="field"><label>角色 *</label><select name="role">${Object.entries(ROLE).map(([k, t]) => `<option value="${k}" ${cur.role === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>負責區域（可多選）</label><div class="checks">${REGIONS.map(r => `<label><input type="checkbox" name="reg" value="${r}" ${curRegs.includes(r) ? 'checked' : ''}>${r}</label>`).join('')}</div><div class="muted">業務主管可看到所勾區域的全部客戶</div></div>
      <div class="field"><label>狀態</label><select name="active"><option value="1" ${cur.active !== false ? 'selected' : ''}>在職</option><option value="0" ${cur.active === false ? 'selected' : ''}>離職（停止登入、保留資料）</option></select></div>
      <div class="field"><label>其他</label><div class="checks"><label><input type="checkbox" name="alsoSales" ${cur.alsoSales ? 'checked' : ''}>兼任業務</label><label><input type="checkbox" name="alsoEngineer" ${cur.alsoEngineer ? 'checked' : ''}>兼任工程師</label></div><div class="muted">勾選後會出現在業務／工程師選單</div></div>
    </div>
    ${isNew ? '' : '<p class="muted">更改 Google 帳號後，此人負責的客戶、Demo 紀錄、行程、紀錄的建立者都會一起改到新帳號；之後請用新帳號登入。</p>'}
    <div class="row-actions" style="margin-top:24px;justify-content:flex-end"><button type="button" class="ghost" id="cancel">取消</button><button type="submit" id="save">儲存</button></div>
  </form>`;
  document.body.appendChild(dlg);
  const form = dlg.querySelector('#uf');
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('#cancel').addEventListener('click', close);
  dlg.addEventListener('cancel', () => dlg.remove());
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const email = form.email.value.trim().toLowerCase();
    const oldEmail = isNew ? '' : cur.email;
    const changed = !isNew && email !== oldEmail;
    const companyEmail = form.companyEmail.value.trim().toLowerCase();
    const nameZh = form.nameZh.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('請輸入正確的 Google 帳號');
    if (!nameZh) return toast('請填寫中文名');
    if (form.role.value === 'manager' && !form.querySelector('input[name=reg]:checked')) return toast('業務主管至少要勾選一個負責區域');
    if ((isNew || changed) && users.has(email)) return toast('這個帳號已經在名單中');
    if (companyEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(companyEmail)) return toast('公司信箱格式不正確');
    if (form.notifyCompany.checked && !companyEmail) return toast('勾選寄到公司信箱，請先填公司信箱');
    if (!form.notifyGmail.checked && !form.notifyCompany.checked && !confirm('兩個信箱都沒勾，此人將收不到任何通知信，確定嗎？')) return;
    if (changed && oldEmail === me.email) return toast('不能更改自己正在登入的帳號，請由另一位管理者操作');
    if (changed && !confirm(`確定把 Google 帳號\n${oldEmail}\n改成\n${email}？\n\n此人負責的客戶、Demo 紀錄、行程、各項紀錄都會一起改到新帳號，舊帳號會立即無法登入。`)) return;
    if (email === me.email && form.active.value === '0') return toast('不能把自己設為離職');
    if (!isNew && email === me.email && form.role.value !== 'admin' && !confirm('你正在移除自己的管理者權限，確定嗎？')) return;
    dlg.querySelector('#save').disabled = true;
    try {
      const data = {
        email, nameZh, nameEn: form.nameEn.value.trim(), companyEmail, notifyGmail: form.notifyGmail.checked, notifyCompany: form.notifyCompany.checked, role: form.role.value, regions: [...form.querySelectorAll('input[name=reg]:checked')].map(i => i.value), region: '', alsoEngineer: form.alsoEngineer.checked, alsoSales: form.alsoSales.checked,
        active: form.active.value === '1', updatedBy: me.email, updatedAt: serverTimestamp()
      };
      if (changed) {
        dlg.querySelector('#save').textContent = '更新中…';
        await setDoc(doc(db, 'users', email), { ...cur, ...data, placeholder: false });
        const n = await moveUserRefs(oldEmail, email);
        await deleteDoc(doc(db, 'users', oldEmail));
        close();
        alert(`已改成新帳號，共更新 ${n} 筆資料。\n請通知 ${nameZh} 改用 ${email} 登入。`);
        return;
      }
      await setDoc(doc(db, 'users', email), data, { merge: true });
      close();
      const n = form.active.value === '0' ? [...customers.values()].filter(c => !c.deleted && c.salesEmail === email).length : 0;
      if (n) { alert(`${nameZh} 已設為離職。\n\n他目前負責 ${n} 位客戶，請到「客戶」頁點「查看名單」調整負責業務。`); }
      else toast('已儲存');
    } catch (err) { toast(errMsg(err)); dlg.querySelector('#save').disabled = false; }
  });
  dlg.showModal();
}

// ---------------- 編號設定（管理者）----------------
async function viewSettings() {
  app.innerHTML = '<div class="card"><h1>編號設定</h1><p class="muted">載入中…</p></div>';
  const vals = {};
  try {
    for (const [k] of COUNTERS) { const s = await getDoc(doc(db, 'counters', k)); vals[k] = s.exists() ? s.data().next : 1; }
  } catch (e) { toast(errMsg(e)); return; }
  app.innerHTML = `<div class="card"><h1>編號設定</h1>
    <p class="muted">設定每一類「下一個要使用的號碼」。例：台北潛在客戶最後一筆是 L-A00354，這裡就填 355。</p>
    <form id="sf"><div class="grid">${COUNTERS.map(([k, t, p]) => `<div class="field"><label>${t}（${p}）下一號</label><input type="number" min="1" name="${k}" value="${vals[k]}"><div class="muted" data-p="${k}">下一筆：${fmt(p, vals[k])}</div></div>`).join('')}</div>
    <div class="row-actions" style="margin-top:20px"><button type="submit">儲存</button></div></form></div>`;
  const form = $('#sf');
  form.addEventListener('input', e => {
    const k = e.target.name; const p = COUNTERS.find(c => c[0] === k)?.[2];
    if (p) form.querySelector(`[data-p="${k}"]`).textContent = '下一筆：' + fmt(p, Math.max(1, parseInt(e.target.value) || 1));
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!confirm('確定更新編號？設定錯誤可能產生重複編號。')) return;
    try {
      for (const [k] of COUNTERS) await setDoc(doc(db, 'counters', k), { next: Math.max(1, parseInt(form[k].value) || 1) });
      toast('已儲存');
    } catch (err) { toast(errMsg(err)); }
  });
}
</script>
